<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--border:#2e1800;--accent:#f97316;--cream:#fef3c7;--muted:#8a6840}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .input-field{width:100%;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--cream);outline:none;transition:border-color .2s}
    .input-field:focus{border-color:var(--accent)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md p-10 rounded-3xl bg-[var(--surface)] border border-[var(--border)] shadow-2xl">
    <div class="text-center mb-10">
      <div class="font-display text-3xl font-black mb-2" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Admin</span></div>
      <p class="text-xs font-bold tracking-[.2em] uppercase text-[var(--muted)]">Secured Access Portal</p>
    </div>
    
    <form id="login-form" class="space-y-6">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2">Email Identity</label>
        <input type="email" id="email" placeholder="admin@rasafoods.lk" required class="input-field">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2">Security Key</label>
        <input type="password" id="password" placeholder="••••••••" required class="input-field">
      </div>
      <button type="submit" id="login-btn" class="w-full py-4 bg-orange-500 text-white font-bold rounded-xl hover:bg-orange-600 transition-all shadow-xl shadow-orange-500/10">Authenticate</button>
    </form>
    
    <div class="mt-10 text-center">
        <a href="index.html" class="text-xs text-[var(--muted)] hover:text-white transition-colors">← Back to Storefront</a>
    </div>
  </div>

<script src="supabase-config.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Authenticating...';
  btn.style.pointerEvents = 'none';

  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();
  
  try {
    if (typeof getSupabase !== 'function') return location.reload();
    var sb = getSupabase();
    if (!sb) return location.reload();

    const { data, error } = await sb.from('admins').select('*').eq('email', email).eq('password_hash', pass).single();
    
    if (data) {
      localStorage.setItem('isAdmin', 'true');
      localStorage.setItem('adminUser', JSON.stringify(data));
      location.href = 'admin-dashboard.html';
    } else {
      alert('Unauthorized access. Please check identity/key.');
      btn.textContent = 'Authenticate';
      btn.style.pointerEvents = 'auto';
    }
  } catch (err) {
    console.error(err);
    alert('System connection error.');
    btn.textContent = 'Authenticate';
    btn.style.pointerEvents = 'auto';
  }
}

document.getElementById('login-form').onsubmit = handleLogin;
</script>
</body>
</html>
