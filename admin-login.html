<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#334155;--accent:#2563eb;--cream:#f8fafc;--muted:#94a3b8}
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    .input-field{width:100%;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--cream);outline:none;transition:border-color .2s}
    .input-field:focus{border-color:var(--accent)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md p-10 rounded-3xl bg-[var(--surface)] border border-[var(--border)] shadow-2xl">
    <div class="text-center mb-8">
      <img src="logo.png" alt="GOGO MART Logo" class="w-16 h-16 object-contain rounded-full mx-auto mb-3 shadow-md border border-blue-400/40">
      <div class="font-display text-3xl font-black mb-1" style="font-family:'Plus Jakarta Sans', sans-serif"><span style="color:var(--accent)">GOGO</span> <span class="text-sm font-normal text-[var(--muted)]">Admin</span></div>
      <p class="text-xs font-bold tracking-[.2em] uppercase text-[var(--muted)]">Secured Access Portal</p>
    </div>
    
    <form id="login-form" class="space-y-6">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2">Email Identity</label>
        <input type="email" id="email" placeholder="admin@gogomart.lk" required class="input-field">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2">Security Key</label>
        <input type="password" id="password" placeholder="••••••••" required class="input-field">
      </div>
      <button type="submit" id="login-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-500 transition-all shadow-xl shadow-blue-500/25">Authenticate</button>
    </form>
    
    <div class="mt-10 text-center">
        <a href="index.html" class="text-xs text-[var(--muted)] hover:text-white transition-colors">← Back to Storefront</a>
    </div>
  </div>

<script src="supabase-config.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Authenticating...';
  btn.style.pointerEvents = 'none';

  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  
  try {
    if (typeof getSupabase !== 'function') return location.reload();
    var sb = getSupabase();
    if (!sb) return location.reload();

    const { error: signInError } = await sb.auth.signInWithPassword({ email, password: pass });
    if (signInError) throw signInError;
    const { data: isAdmin, error: roleError } = await sb.rpc('is_admin');
    if (roleError || isAdmin !== true) {
      await sb.auth.signOut();
      throw new Error('This account is not approved for the admin panel.');
    }
    location.href = 'admin-dashboard.html';
  } catch (err) {
    console.error(err);
    alert(err.message || 'Admin sign in failed.');
    btn.textContent = 'Authenticate';
    btn.style.pointerEvents = 'auto';
  }
}

document.getElementById('login-form').onsubmit = handleLogin;
</script>
</body>
</html>
