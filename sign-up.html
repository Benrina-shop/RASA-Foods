<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { display: ['Plus Jakarta Sans','serif'], body: ['Plus Jakarta Sans','sans-serif'] } } } }
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif;overflow-x:hidden}
    .gbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
    .gbtn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .5s}
    .gbtn:hover::before{left:100%}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md p-8 rounded-3xl bg-[var(--surface)] border border-[var(--border)] relative">
    <a href="index.html" class="absolute top-6 right-6 text-[var(--muted)] hover:text-[var(--accent)] transition-colors text-sm">✕</a>
    <div class="text-center mb-8">
      <img src="logo.png" alt="GOGO MART Logo" class="w-16 h-16 object-contain rounded-full mx-auto mb-3 shadow-md border border-blue-200">
      <div class="font-display text-3xl font-black mb-1"><span style="color:var(--accent)">GOGO</span> MART</div>
      <p class="text-sm text-[var(--muted)]">Create an account using your mobile number and password.</p>
    </div>
    <form id="sign-up-form" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-2 text-[var(--cream)]">Full Name</label>
        <input id="full-name" type="text" autocomplete="name" required maxlength="120" class="w-full p-3 rounded-xl bg-white border border-[var(--border)] outline-none text-[#0f172a] focus:border-[var(--accent)] transition-colors">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2 text-[var(--cream)]" for="customer-address">Address</label>
        <textarea id="customer-address" autocomplete="street-address" required maxlength="500" rows="3" placeholder="House number, street, town/city" class="w-full p-3 rounded-xl bg-white border border-[var(--border)] outline-none text-[#0f172a] focus:border-[var(--accent)] transition-colors"></textarea>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2 text-[var(--cream)]" for="mobile-number">Mobile Number</label>
        <input id="mobile-number" type="tel" autocomplete="tel" inputmode="tel" required minlength="9" maxlength="20" placeholder="077 123 4567 or +94 77 123 4567" class="w-full p-3 rounded-xl bg-white border border-[var(--border)] outline-none text-[#0f172a] focus:border-[var(--accent)] transition-colors">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2 text-[var(--cream)]">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password" required minlength="8" class="w-full p-3 rounded-xl bg-white border border-[var(--border)] outline-none text-[#0f172a] focus:border-[var(--accent)] transition-colors">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2 text-[var(--cream)]">Confirm Password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" class="w-full p-3 rounded-xl bg-white border border-[var(--border)] outline-none text-[#0f172a] focus:border-[var(--accent)] transition-colors">
      </div>
      <p id="signup-message" role="status" aria-live="polite" class="text-sm text-center text-[var(--muted)]"></p>
      <button type="submit" class="gbtn w-full py-4 rounded-xl font-bold text-white mt-4 bg-gradient-to-r from-blue-600 to-pink-500 shadow-lg shadow-blue-500/20">Create Account</button>
      <div class="text-center mt-6">
        <a href="sign-in.html" class="text-sm text-[var(--muted)] hover:text-[var(--accent)] transition-colors">Already have an account? Sign in</a>
      </div>
    </form>
  </div>
</div>

<script>
  function normalizeSignupPhone(value) {
    const raw = value.trim().replace(/[\s()-]/g, '');
    if (raw.startsWith('+')) return raw;
    if (raw.startsWith('00')) return '+' + raw.slice(2);
    if (raw.startsWith('94') && raw.length === 11) return '+' + raw;
    if (raw.startsWith('0')) return '+94' + raw.slice(1);
    return '+94' + raw;
  }

  async function saveSignupProfile(user, profile) {
    const sb = getSupabase();
    const { error } = await sb.from('customer_profiles').upsert({
      user_id: user.id,
      full_name: profile.full_name,
      address: profile.address,
      phone: user.phone || profile.phone
    }, { onConflict: 'user_id' });
    if (error) throw error;
  }

  document.getElementById('sign-up-form').addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;
    const message = document.getElementById('signup-message');
    const name = document.getElementById('full-name').value.trim();
    const address = document.getElementById('customer-address').value.trim();
    const phone = normalizeSignupPhone(document.getElementById('mobile-number').value);
    const password = document.getElementById('signup-password').value;
    const confirmation = document.getElementById('confirm-password').value;
    if (password !== confirmation) { message.textContent = 'Passwords do not match.'; return; }
    if (!/^\+[1-9][0-9]{7,14}$/.test(phone)) { message.textContent = 'Enter a valid mobile number with country code.'; return; }
    button.disabled = true;
    button.textContent = 'Creating account...';
    message.textContent = '';
    try {
      const sb = getSupabase();
      if (!sb) throw new Error('Account service is unavailable. Refresh and try again.');
      const { data, error } = await sb.auth.signUp({
        phone, password
      });
      if (error) throw error;
      form.reset();
      if (data.session) {
        await saveSignupProfile(data.user, { full_name: name, address, phone });
        location.href = 'account.html';
      }
      else {
        message.textContent = 'Account created. Supabase requires phone confirmation before sign-in; disable phone confirmation in Auth settings to continue without SMS.';
        button.textContent = originalText;
        button.disabled = false;
      }
    } catch (error) {
      message.textContent = error.message || 'Could not create your account. Please try again.';
      button.textContent = originalText;
      button.disabled = false;
    }
  });

</script>

</body>
</html>
