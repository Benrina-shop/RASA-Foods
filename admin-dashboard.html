<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--cream:#fef3c7;--muted:#8a6840}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2rem 1.5rem}
    .main-content{margin-left:260px;padding:2rem 3rem}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-radius:12px;color:var(--muted);transition:all .2s;margin-bottom:.5rem}
    .nav-link:hover, .nav-link.active{background:rgba(249,115,22,.1);color:var(--accent)}
    .stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:1.5rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="sidebar">
    <div class="font-display text-2xl font-bold mb-10"><span style="color:var(--accent)">R</span>ASA Admin</div>
    <nav>
      <a href="admin-dashboard.html" class="nav-link active">Dashboard</a>
      <a href="admin-products.html" class="nav-link">Products</a>
      <a href="admin-orders.html" class="nav-link">Orders</a>
      <a href="index.html" class="nav-link mt-10 text-sm">← Live Site</a>
      <button onclick="localStorage.removeItem('isAdmin'); location.href='admin-login.html'" class="nav-link text-sm w-full text-left">Logout</button>
    </nav>
  </div>

  <main class="main-content">
    <h1 class="text-3xl font-bold mb-8" style="font-family:'Playfair Display',serif">Overview</h1>
    
    <div class="grid grid-cols-3 gap-6 mb-10">
      <div class="stat-card">
        <p class="text-sm text-[var(--muted)]">Total Orders</p>
        <div id="stat-orders" class="text-3xl font-bold text-[var(--accent)]">...</div>
      </div>
      <div class="stat-card">
        <p class="text-sm text-[var(--muted)]">Total Revenue</p>
        <div id="stat-revenue" class="text-3xl font-bold text-[var(--accent)]">...</div>
      </div>
      <div class="stat-card">
        <p class="text-sm text-[var(--muted)]">Product Count</p>
        <div id="stat-products" class="text-3xl font-bold text-[var(--accent)]">...</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-8">
      <div class="stat-card">
        <h3 class="font-bold mb-4">Recent Orders</h3>
        <div id="recent-orders" class="space-y-4 text-sm"></div>
      </div>
      <div class="stat-card">
          <h3 class="font-bold mb-4">Quick Actions</h3>
          <div class="space-y-3">
              <button onclick="location.href='admin-products.html'" class="w-full py-3 bg-[var(--surface)] border border-[var(--border)] rounded-xl hover:border-[var(--accent)] transition-colors text-left px-4">➕ Add New Product</button>
              <button onclick="location.href='admin-orders.html'" class="w-full py-3 bg-[var(--surface)] border border-[var(--border)] rounded-xl hover:border-[var(--accent)] transition-colors text-left px-4">📋 View All Orders</button>
          </div>
      </div>
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
checkAdmin();

async function loadStats() {
  const { data: orders } = await supabase.from('orders').select('id, total_amount, created_at, customer_name').order('created_at', {ascending: false});
  const { count: prodCount } = await supabase.from('products').select('*', { count: 'exact', head: true });

  if (orders) {
    document.getElementById('stat-orders').textContent = orders.length;
    const revenue = orders.reduce((s, o) => s + parseFloat(o.total_amount), 0);
    document.getElementById('stat-revenue').textContent = formatPrice(revenue);
    
    document.getElementById('recent-orders').innerHTML = orders.slice(0, 5).map(o => `
      <div class="flex justify-between items-center bg-[var(--bg)] p-3 rounded-lg border border-[var(--border)]">
        <div>
          <p class="font-bold">${o.customer_name}</p>
          <p class="text-xs text-[var(--muted)]">${new Date(o.created_at).toLocaleDateString()}</p>
        </div>
        <div class="text-[var(--accent)] font-bold">${formatPrice(o.total_amount)}</div>
      </div>
    `).join('');
  }
  
  document.getElementById('stat-products').textContent = prodCount || 0;
}

loadStats();
</script>
</body>
</html>
