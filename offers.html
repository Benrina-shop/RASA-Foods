<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Discounts — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--border:#2e1800;--accent:#f97316;--gold:#f59e0b;--cream:#fef3c7;--muted:#8a6840}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,3,0,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:1.2rem 1.5rem}
    .prod-card{border-radius:20px;background:var(--surface);border:1px solid var(--border);overflow:hidden;transition:all .3s ease;cursor:pointer}
    .prod-card:hover{transform:translateY(-8px);border-color:var(--accent)}
    .badge{position:absolute;top:14px;right:14px;background:var(--accent);color:white;font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:700;z-index:2}
    .fu{opacity:0;transform:translateY(30px);transition:all .8s ease}.vis{opacity:1;transform:translateY(0)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl font-bold" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Foods</span></a>
    <div class="hidden md:flex items-center gap-8 text-sm font-medium">
      <a href="index.html" class="hover:text-[var(--accent)] transition-colors">Home</a>
      <a href="products.html" class="hover:text-[var(--accent)] transition-colors">Products</a>
      <a href="offers.html" class="text-[var(--accent)]">Offers</a>
    </div>
    <a href="cart.html" class="relative p-2"><svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg><span id="cart-count" class="absolute -top-1 -right-1 bg-[var(--accent)] text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">0</span></a>
  </div>
</nav>

<div class="pt-32 pb-20 px-6">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16 fu">
      <h1 class="font-display text-5xl font-black mb-4" style="font-family:'Playfair Display',serif">Exclusive <em style="color:var(--accent)">Offers</em></h1>
      <p class="text-[var(--muted)]">Limited time discounts on our premium collection.</p>
    </div>
    
    <div class="grid md:grid-cols-3 gap-8 mb-20" id="sale-grid">
      <div class="col-span-full py-20 text-center text-[var(--muted)] font-medium">Scanning for active deals...</div>
    </div>

    <div class="grid md:grid-cols-2 gap-8 fu delay-2">
      <div class="p-8 rounded-3xl bg-gradient-to-br from-orange-600/20 to-transparent border border-orange-500/30 flex flex-col justify-between">
        <div>
          <h3 class="text-2xl font-bold mb-2">First Purchase?</h3>
          <p class="text-orange-200/60 mb-6">Enjoy 15% OFF your first order with this code.</p>
        </div>
        <div class="flex items-center justify-between p-4 bg-black/40 rounded-2xl border border-white/10 uppercase tracking-widest font-black text-xl">
          <span>WELCOME15</span>
          <button onclick="copyCode('WELCOME15')" class="text-xs font-bold text-orange-500 hover:text-white transition-colors">COPY</button>
        </div>
      </div>
      <div class="p-8 rounded-3xl bg-gradient-to-br from-[#1c1c1c] to-transparent border border-white/5">
        <h3 class="text-2xl font-bold mb-2">Free Shipping</h3>
        <p class="text-zinc-500">Orders over $50 quality for free express delivery nationwide.</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50"></div>

<script src="supabase-config.js"></script>
<script>
let PRODUCTS = [];
let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

async function initOffers() {
  try {
    if (typeof supabase === 'undefined') return setTimeout(initOffers, 500);
    const { data, error } = await supabase.from('products').select('*');
    if (error) throw error;
    PRODUCTS = data;
    renderOffers();
    updateCartCount();
  } catch (err) {
    console.error(err);
    document.getElementById('sale-grid').innerHTML = '<div class="col-span-full text-center text-red-400">Error loading deals.</div>';
  }
}

function renderOffers() {
  const saleProducts = PRODUCTS.filter(p => p.old_price && p.old_price > p.price);
  const grid = document.getElementById('sale-grid');
  
  if (!saleProducts.length) {
    grid.innerHTML = '<div class="col-span-full py-20 text-center text-[var(--muted)]">No active discounts right now. Check back soon!</div>';
    return;
  }
  
  grid.innerHTML = saleProducts.map(p => {
    const disc = Math.round(((p.old_price - p.price) / p.old_price) * 100);
    return `
      <div class="prod-card relative" onclick="location.href='product-detail.html?id=${p.id}'">
        <div class="badge">-${disc}%</div>
        <img src="${p.image_url}" class="w-full h-64 object-cover" alt="${p.name}">
        <div class="p-6">
          <p class="text-xs uppercase text-[var(--accent)] font-bold mb-1">${p.category_slug}</p>
          <h3 class="font-bold text-lg mb-3">${p.name}</h3>
          <div class="flex items-center justify-between">
            <div class="flex items-baseline gap-2">
              <span class="text-[var(--accent)] font-black">${typeof formatPrice === 'function' ? formatPrice(p.price) : 'Rs.'+p.price}</span>
              <span class="text-sm line-through text-[var(--muted)]">${typeof formatPrice === 'function' ? formatPrice(p.old_price) : 'Rs.'+p.old_price}</span>
            </div>
            <button onclick="addToCart(${p.id},event)" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition-all font-black">+</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateCartCount() { document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0); }
function addToCart(id, e) {
  if (e) e.stopPropagation();
  const p = PRODUCTS.find(x => x.id == id);
  if(!p) return;
  const ex = cart.find(x => x.id == id);
  if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  updateCartCount();
  showToast('🛒 Deal added to cart!');
}
function copyCode(c) { navigator.clipboard.writeText(c); showToast('✅ Code Copied!'); }
function showToast(m) {
  const t = document.createElement('div');
  t.className = 'p-4 bg-[var(--accent)] text-white rounded-2xl shadow-2xl font-bold mb-2';
  t.textContent = m; document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

const obs = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('vis')), { threshold: .1 });
document.querySelectorAll('.fu').forEach(el => obs.observe(el));

initOffers();
</script>
</body>
</html>
