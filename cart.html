<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--gold:#f59e0b;--cream:#fef3c7;--muted:#8a6840}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.2rem 1.5rem;background:rgba(8,3,0,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:500;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--cream)}
    .cart-item{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.25rem;display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem}
    .cart-img{width:90px;height:90px;object-fit:cover;border-radius:14px}
    .qty-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--cream);cursor:pointer}
    #summary-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:1.5rem;position:sticky;top:120px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl font-bold" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Foods</span></a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
    </div>
    <div class="flex items-center gap-3">
        <span id="cart-count" class="text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold bg-[var(--accent)]">0</span>
    </div>
  </div>
</nav>

<main class="pt-32 pb-24 px-6 min-h-screen">
  <div class="max-w-7xl mx-auto grid md:grid-cols-3 gap-8">
    <div class="md:col-span-2">
      <h1 class="font-display text-4xl font-bold mb-8" style="font-family:'Playfair Display',serif">Your Shopping Cart</h1>
      <div id="cart-items"></div>
    </div>
    <div>
      <div id="summary-card">
        <h2 class="font-display text-2xl font-bold mb-6" style="font-family:'Playfair Display',serif">Order Summary</h2>
        <div class="space-y-4 mb-6 text-sm">
          <div class="flex justify-between text-[var(--muted)]"><span>Subtotal</span><span id="subtotal" class="text-[var(--cream)]">Rs. 0</span></div>
          <div class="flex justify-between text-[var(--muted)]"><span>Delivery</span><span class="text-[var(--cream)]">Rs. 350</span></div>
          <div class="pt-4 border-t border-[var(--border)] flex justify-between font-bold text-lg"><span>Total</span><span id="total" class="text-[var(--accent)]">Rs. 0</span></div>
        </div>
        <button onclick="location.href='checkout.html'" class="w-full py-4 bg-orange-500 text-white font-bold rounded-2xl hover:bg-orange-600 transition-colors">Checkout Now</button>
      </div>
    </div>
  </div>
</main>

<script src="supabase-config.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

function renderCart() {
  const container = document.getElementById('cart-items');
  const cartCountEl = document.getElementById('cart-count');
  
  cartCountEl.textContent = cart.reduce((s, i) => s + i.qty, 0);
  
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="text-center py-20 bg-[var(--surface)] border border-[var(--border)] rounded-3xl">
        <div class="text-5xl mb-4">🛒</div>
        <h3 class="text-xl font-bold mb-2">Your cart is empty</h3>
        <p class="text-[var(--muted)] mb-6">Looks like you haven't added anything yet.</p>
        <a href="products.html" class="inline-block py-3 px-8 bg-orange-500 text-white font-bold rounded-full">Start Shopping</a>
      </div>
    `;
    updateSummary(0);
    return;
  }

  let subtotal = 0;
  container.innerHTML = cart.map((item, idx) => {
    subtotal += item.price * item.qty;
    return `
      <div class="cart-item">
        <img src="${item.image_url}" class="cart-img" alt="${item.name}">
        <div class="flex-1">
          <p class="text-xs text-[var(--accent)] mb-1 uppercase tracking-widest">${item.category_slug}</p>
          <h3 class="font-bold text-[var(--cream)]">${item.name}</h3>
          <p class="text-sm font-bold text-[var(--accent)]">${formatPrice(item.price)}</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="updateQty(${idx}, -1)" class="qty-btn">−</button>
          <span class="font-bold w-4 text-center text-sm">${item.qty}</span>
          <button onclick="updateQty(${idx}, 1)" class="qty-btn">+</button>
        </div>
        <button onclick="removeItem(${idx})" class="text-[var(--muted)] hover:text-red-500 transition-colors">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;
  }).join('');
  
  updateSummary(subtotal);
}

function updateQty(idx, delta) {
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  save();
}

function removeItem(idx) {
  cart.splice(idx, 1);
  save();
}

function updateSummary(sub) {
  document.getElementById('subtotal').textContent = formatPrice(sub);
  document.getElementById('total').textContent = formatPrice(sub > 0 ? sub + 350 : 0);
}

function save() {
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  renderCart();
}

renderCart();
</script>
</body>
</html>
