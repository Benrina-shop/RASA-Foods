<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Your Basket — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f0f7ff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    *, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
    html, body{width:100%;max-width:100vw;overflow-x:hidden;background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    .cart-item{background:#ffffff;border:1px solid var(--border);border-radius:16px;padding:0.75rem;display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;box-shadow:0 2px 6px rgba(15,23,42,0.02);width:100%;max-width:100%}
    @media (min-width: 640px) {
      .cart-item{border-radius:20px;padding:1.25rem;gap:1.25rem;margin-bottom:1rem}
    }
    .cart-img{width:60px;height:60px;object-fit:contain;padding:4px;border-radius:12px;border:1px solid var(--border);background:#f8fafc;flex-shrink:0}
    @media (min-width: 640px) {
      .cart-img{width:88px;height:88px;border-radius:16px}
    }
    .qty-btn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;cursor:pointer;font-weight:bold;transition:all .2s;font-size:12px}
    @media (min-width: 640px) {
      .qty-btn{width:32px;height:32px;border-radius:9px;font-size:14px}
    }
    .qty-btn:hover{background:#e2e8f0}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:600;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--accent)}
      .nav-link{color:#475569;font-size:.85rem;font-weight:700;padding:.45rem .85rem;border-radius:9999px;transition:all .2s;display:inline-flex;align-items:center;gap:.375rem;text-decoration:none;letter-spacing:0.01em}
    .nav-link:hover{color:#2563eb;background:rgba(37,99,235,0.08)}
    .nav-link.active{color:#2563eb;background:rgba(37,99,235,0.12);font-weight:800}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <nav class="sticky top-0 z-[100] bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
    <div class="max-w-6xl mx-auto px-3.5 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-4 lg:gap-6">
      <!-- Left: Brand Logo & Navigation Links Group -->
        <div class="flex items-center gap-3 lg:gap-5 shrink-0">
          <!-- Brand Logo with clear border separation -->
          <a href="index.html" class="flex items-center gap-2.5 font-display text-xl sm:text-2xl font-bold shrink-0 hover:opacity-90 transition-opacity pr-4 sm:pr-5 border-r border-slate-300">
            <img src="logo.png" alt="GOGO MART Logo" class="w-8 h-8 sm:w-10 sm:h-10 object-contain rounded-full shadow-sm border border-blue-400/30">
            <span class="flex items-baseline gap-1.5"><span class="font-black tracking-tight" style="color:var(--accent)">GOGO</span> <span class="text-xs sm:text-sm font-bold tracking-widest text-slate-400 uppercase">MART</span></span>
          </a>

          <!-- Desktop Navigation Links -->
          <div class="hidden md:flex items-center gap-1 lg:gap-1.5 pl-1">
            <a href="index.html" class="nav-link ">Home</a>
            <a href="products.html" class="nav-link ">Products</a>
            <a href="products.html?wishlist=1" class="nav-link wishlist-link">&#129293; Wishlist (<span data-wishlist-count>0</span>)</a>
            <a href="offers.html" class="nav-link ">Offers</a>
            <a href="contact.html" class="nav-link ">Contact</a>
          </div>
        </div>

      <a href="products.html" class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-slate-700 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 px-3.5 py-1.5 rounded-full transition-colors shrink-0">
        ← Products
      </a>
    </div>
  </nav>

  <main class="pt-4 sm:pt-8 pb-16 px-3 sm:px-6 min-h-screen w-full max-w-full overflow-hidden">
    <div class="max-w-5xl mx-auto flex flex-col lg:grid lg:grid-cols-12 gap-5 sm:gap-8 w-full">
      <!-- Cart Items List (Col-7) -->
      <div class="lg:col-span-7">
        <div class="flex items-center justify-between mb-4">
          <h1 class="font-display text-xl sm:text-2xl lg:text-3xl font-black text-slate-900">Your Basket</h1>
          <span class="text-xs font-bold text-slate-500"><span id="cart-items-count">0</span> items</span>
        </div>
        <div id="cart-items" class="space-y-3"></div>
      </div>

      <!-- Summary Card (Col-5) -->
      <div class="lg:col-span-5">
        <div class="bg-white border border-slate-200 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-sm w-full lg:sticky lg:top-20">
          <h2 class="font-display text-base sm:text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Order Summary</h2>
          <div class="space-y-3 mb-5 text-xs sm:text-sm">
            <div class="flex justify-between text-slate-600"><span>Subtotal</span><span id="subtotal" class="text-slate-900 font-bold">Rs. 0</span></div>
            <div class="flex justify-between text-slate-600"><span>Express Delivery</span><span class="text-slate-900 font-bold">Rs. 399</span></div>
            <div class="pt-3 border-t border-slate-100 flex justify-between font-black text-base sm:text-lg"><span>Net Total</span><span id="total" class="text-blue-600">Rs. 0</span></div>
          </div>
          <button onclick="location.href='checkout.html'" class="w-full py-4 bg-gradient-to-r from-blue-600 via-pink-500 to-amber-500 hover:opacity-95 text-white font-bold rounded-2xl transition-all shadow-xl shadow-blue-500/20 uppercase tracking-wider text-xs sm:text-sm flex items-center justify-center gap-2">
            <span>Proceed to Checkout</span>
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
          <p class="text-[10px] text-center mt-4 text-slate-400 uppercase tracking-widest font-bold flex items-center justify-center gap-1">🔒 100% Cash On Delivery Verified</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-[11px] text-slate-400 font-medium text-center py-6 px-4 border-t border-slate-200 bg-white">
    © 2026 GOGO MART. Your Trusted Online Store.
  </footer>

  <script src="supabase-config.js"></script>
  <script>
  let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

  function renderCart() {
    const container = document.getElementById('cart-items');
    const countEl = document.getElementById('cart-items-count');
    
    const totalCount = cart.reduce((s, i) => s + i.qty, 0);
    if (countEl) countEl.textContent = totalCount;
    
    if (cart.length === 0) {
      container.innerHTML = `
        <div class="text-center py-16 bg-white border border-slate-200 rounded-3xl p-6">
          <div class="text-5xl mb-4">🏺</div>
          <h3 class="text-xl font-bold mb-2 text-slate-900">Your basket is empty</h3>
          <p class="text-slate-500 mb-6 max-w-xs mx-auto text-xs">Explore our premium selection and find something extraordinary today.</p>
          <a href="products.html" class="inline-block py-3 px-8 bg-gradient-to-r from-blue-600 to-pink-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider shadow-md">Browse Products</a>
        </div>
      `;
      updateSummary(0);
      return;
    }

    let subtotal = 0;
    container.innerHTML = cart.map((item, idx) => {
      subtotal += item.price * item.qty;
      return `
        <div class="cart-item">
          <img src="${item.image_url}" class="cart-img" alt="${item.name}">
          <div class="flex-1 min-w-0">
            <p class="text-[10px] text-blue-600 mb-0.5 uppercase tracking-wider font-bold truncate">${item.category_slug || 'Item'}</p>
            <h3 class="font-bold text-xs sm:text-sm text-slate-900 mb-1 truncate">${item.name}</h3>
            <p class="text-xs font-black text-blue-600">${formatPrice(item.price)}</p>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200 shrink-0">
            <button onclick="updateQty(${idx}, -1)" class="qty-btn">－</button>
            <span class="font-black w-5 text-center text-xs text-slate-900">${item.qty}</span>
            <button onclick="updateQty(${idx}, 1)" class="qty-btn">＋</button>
          </div>
          <button onclick="removeItem(${idx})" class="p-1.5 text-slate-400 hover:text-red-500 transition-colors shrink-0" aria-label="Remove item">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      `;
    }).join('');
    
    updateSummary(subtotal);
  }

  function updateQty(idx, delta) {
    cart[idx].qty = Math.max(1, cart[idx].qty + delta);
    save();
  }

  function removeItem(idx) {
    if(confirm('Remove this item from your basket?')) {
      cart.splice(idx, 1);
      save();
    }
  }

  function updateSummary(sub) {
    document.getElementById('subtotal').textContent = formatPrice(sub);
    const total = sub > 0 ? sub + 399 : 0;
    document.getElementById('total').textContent = formatPrice(total);
  }

  function save() {
    localStorage.setItem('rasa-cart', JSON.stringify(cart));
    renderCart();
  }

  renderCart();
  </script>
</body>
</html>
