<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Basket — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f0f7ff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif;overflow-x:hidden}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 1.5rem;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(15,23,42,0.03)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:600;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--accent)}
    .cart-item{background:#ffffff;border:1px solid var(--border);border-radius:24px;padding:1.5rem;display:flex;align-items:center;gap:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(15,23,42,0.03)}
    .cart-img{width:100px;height:100px;object-fit:cover;border-radius:18px;border:1px solid var(--border);background:#f1f5f9}
    .qty-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;cursor:pointer;font-weight:bold;transition:all .2s}
    .qty-btn:hover{background:#e2e8f0}
    #summary-card{background:#ffffff;border:1px solid var(--border);border-radius:32px;padding:2rem;position:sticky;top:120px;box-shadow:0 4px 25px rgba(15,23,42,0.04)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 font-display text-2xl font-bold" style="font-family:'Plus Jakarta Sans', sans-serif">
      <img src="logo.png" alt="GOGO MART Logo" class="w-10 h-10 object-contain rounded-full shadow-md border border-orange-500/30">
      <span><span style="color:var(--accent)">GOGO</span> <span class="text-sm font-semibold tracking-wider text-[var(--muted)]">MART</span></span>
    </a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="sign-in.html" class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 bg-white hover:border-blue-500 hover:text-blue-600 transition-all shadow-sm text-slate-700">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs font-bold uppercase tracking-wider hidden sm:inline">Sign In</span>
      </a>
      <div class="p-2.5 rounded-full bg-white border border-slate-200 text-slate-700 shadow-sm relative">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="cart-count" class="text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold bg-pink-500 absolute -top-1 -right-1 shadow-md">0</span>
      </div>
    </div>
  </div>
</nav>

<main class="pt-32 pb-24 px-6 min-h-screen">
  <div class="max-w-7xl mx-auto grid lg:grid-cols-3 gap-12">
    <div class="lg:col-span-2">
      <h1 class="font-display text-4xl font-black mb-10" style="font-family:'Plus Jakarta Sans', sans-serif">Shopping Bag</h1>
      <div id="cart-items" class="space-y-4"></div>
    </div>
    <div>
      <div id="summary-card">
        <h2 class="font-display text-2xl font-bold mb-8" style="font-family:'Plus Jakarta Sans', sans-serif">Summary</h2>
        <div class="space-y-5 mb-8 text-sm">
          <div class="flex justify-between text-slate-500"><span>Subtotal</span><span id="subtotal" class="text-slate-900 font-bold">Rs. 0</span></div>
          <div class="flex justify-between text-slate-500"><span>Express Delivery</span><span class="text-slate-900 font-bold">Rs. 399</span></div>
          <div class="pt-6 border-t border-slate-100 flex justify-between font-black text-xl"><span>Net Total</span><span id="total" class="text-blue-600">Rs. 0</span></div>
        </div>
        <button onclick="location.href='checkout.html'" class="w-full py-5 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-pink-500 hover:to-pink-600 text-white font-bold rounded-2xl transition-all shadow-xl shadow-blue-500/20">Proceed to Checkout</button>
        <p class="text-[10px] text-center mt-6 text-slate-400 uppercase tracking-widest font-bold flex items-center justify-center gap-1">🔒 Secure SSL Checkout</p>
      </div>
    </div>
  </div>
</main>

<footer class="py-16 px-6 border-t border-[var(--border)] bg-[var(--surface)] text-center">
  <div class="flex items-center justify-center gap-3 mb-4">
    <img src="logo.png" alt="GOGO MART" class="w-12 h-12 object-contain rounded-full border border-orange-500/30">
    <span class="font-display text-3xl font-black text-[var(--accent)]" style="font-family:'Plus Jakarta Sans', sans-serif">GOGO MART</span>
  </div>
  <div class="flex justify-center gap-8 mb-8 text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">
      <a href="index.html" class="hover:text-white transition-colors">Home</a>
      <a href="products.html" class="hover:text-white transition-colors">Products</a>
  </div>
  <div class="text-[10px] text-[var(--muted)] uppercase tracking-widest opacity-40">© 2024 GOGO MART. Handcrafted for excellence.</div>
</footer>

<script src="supabase-config.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

function renderCart() {
  const container = document.getElementById('cart-items');
  const cartCountEl = document.getElementById('cart-count');
  
  cartCountEl.textContent = cart.reduce((s, i) => s + i.qty, 0);
  
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="text-center py-20 bg-[var(--surface)] border border-[var(--border)] rounded-[40px] border-dashed">
        <div class="text-6xl mb-6">🏺</div>
        <h3 class="text-2xl font-bold mb-3">Your basket is empty</h3>
        <p class="text-[var(--muted)] mb-8 max-w-xs mx-auto text-sm">Explore our premium selection and find something extraordinary today.</p>
        <a href="products.html" class="inline-block py-4 px-10 bg-orange-500 text-white font-bold rounded-2xl shadow-xl shadow-orange-500/10">Browse Catalogue</a>
      </div>
    `;
    updateSummary(0);
    return;
  }

  let subtotal = 0;
  container.innerHTML = cart.map((item, idx) => {
    subtotal += item.price * item.qty;
    return `
      <div class="cart-item items-center">
        <img src="${item.image_url}" class="cart-img" alt="${item.name}">
        <div class="flex-1">
          <p class="text-[10px] text-blue-600 mb-1 uppercase tracking-widest font-bold">${item.category_slug}</p>
          <h3 class="font-bold text-lg text-slate-900 mb-1">${item.name}</h3>
          <p class="text-sm font-black text-blue-600">${formatPrice(item.price)}</p>
        </div>
        <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-200">
          <button onclick="updateQty(${idx}, -1)" class="qty-btn">−</button>
          <span class="font-black w-6 text-center text-sm text-slate-900">${item.qty}</span>
          <button onclick="updateQty(${idx}, 1)" class="qty-btn">+</button>
        </div>
        <button onclick="removeItem(${idx})" class="p-3 text-slate-400 hover:text-red-500 transition-colors">
          <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    `;
  }).join('');
  
  updateSummary(subtotal);
}

function updateQty(idx, delta) {
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  save();
}

function removeItem(idx) {
  if(confirm('Remove this item from your basket?')) {
    cart.splice(idx, 1);
    save();
  }
}

function updateSummary(sub) {
  document.getElementById('subtotal').textContent = formatPrice(sub);
  const total = sub > 0 ? sub + 399 : 0;
  document.getElementById('total').textContent = formatPrice(total);
}

function save() {
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  renderCart();
}

renderCart();
</script>
</body>
</html>
