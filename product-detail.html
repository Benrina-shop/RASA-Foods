<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f0f7ff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:1.1rem 1.5rem;box-shadow:0 2px 10px rgba(15,23,42,0.02)}
    .qty-btn{width:36px;height:36px;border-radius:10px;background:#ffffff;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;transition:all .2s;color:#0f172a;font-weight:bold}
    .qty-btn:hover{background:#f1f5f9;border-color:#94a3b8}
    .thumbnail{width:80px;height:80px;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:all .2s;opacity:.6;background:#f1f5f9}
    .thumbnail.active{border-color:var(--accent);opacity:1;box-shadow:0 0 0 3px rgba(37,99,235,0.15)}
    .badge{background:linear-gradient(135deg,#ec4899,#f43f5e);color:white;font-size:.7rem;padding:4px 12px;border-radius:20px;font-weight:800;box-shadow:0 2px 8px rgba(236,72,153,0.3)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 font-display text-2xl font-bold" style="font-family:'Plus Jakarta Sans', sans-serif">
      <img src="logo.png" alt="GOGO MART Logo" class="w-10 h-10 object-contain rounded-full shadow-md border border-orange-500/30">
      <span><span style="color:var(--accent)">GOGO</span> <span class="text-sm font-semibold tracking-wider text-[var(--muted)]">MART</span></span>
    </a>
      <!-- Global Live Search Bar with Instant Dropdown -->
      <div class="hidden sm:flex flex-1 max-w-md mx-6 relative" id="nav-search-container">
        <form action="products.html" method="GET" class="w-full relative" onsubmit="return handleNavSearch(event, this)">
          <div class="relative flex items-center w-full">
            <span class="absolute left-3.5 text-slate-400 pointer-events-none">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" name="q" id="nav-search-input" placeholder="Search Your Products" autocomplete="off" oninput="handleLiveSearch(this.value)" onfocus="handleLiveSearch(this.value)" class="nav-search-input w-full pl-10 pr-10 py-2 text-xs rounded-full bg-slate-100 hover:bg-slate-100/80 focus:bg-white border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none text-slate-800 transition-all">
            <button type="submit" class="absolute right-2 p-1 text-slate-400 hover:text-blue-600 transition-colors">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
          </div>
        </form>

        <!-- Live Instant Search Dropdown Results -->
        <div id="live-search-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-[1000] max-h-96 overflow-y-auto divide-y divide-slate-100">
          <div id="live-search-results" class="p-2 space-y-1"></div>
          <div id="live-search-footer" class="p-2.5 bg-slate-50 text-center border-t border-slate-100">
            <a href="products.html" id="view-all-search-link" class="text-[11px] font-bold text-blue-600 hover:text-blue-700 hover:underline">
              View all results
            </a>
          </div>
        </div>
      </div>
    <div class="flex items-center gap-6">
      <a href="products.html" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-blue-600 transition-colors">← Back to Catalogue</a>
      <a href="cart.html" class="relative p-2.5 rounded-full bg-white border border-slate-200 text-slate-700 hover:text-blue-600 shadow-sm transition-all"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="cart-count" class="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold shadow-md">0</span></a>
      <button onclick="document.getElementById(\'mob-menu\').style.transform=\'translateY(0)\'" class="md:hidden p-2 text-slate-700" aria-label="Open menu"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
</nav>
  <!-- Mobile Menu Drawer -->
  <div id="mob-menu" class="fixed inset-0 bg-white z-[2000] flex flex-col justify-center items-center gap-6" style="transform:translateY(-100%); transition:transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
    <button onclick="document.getElementById('mob-menu').style.transform='translateY(-100%)'" class="absolute top-6 right-6 p-2 text-slate-400 hover:text-slate-700 text-2xl font-bold">✕</button>
    <img src="logo.png" alt="GOGO MART" class="w-20 h-20 object-contain rounded-full shadow-lg border border-blue-400 mb-2">
    <div class="font-display text-2xl font-black mb-4 text-slate-900"><span style="color:var(--accent)">GOGO</span> <span class="text-pink-500">MART</span></div>
    <a href="index.html" class="text-2xl font-bold text-slate-800 hover:text-blue-600">Home</a>
    <a href="products.html" class="text-2xl font-bold text-slate-800 hover:text-blue-600">Products</a>
    <a href="offers.html" class="text-2xl font-bold text-slate-800 hover:text-pink-600">Offers</a>
    <a href="contact.html" class="text-2xl font-bold text-slate-800 hover:text-blue-600">Contact</a>
    <a href="cart.html" class="text-2xl font-bold text-slate-800 hover:text-blue-600">Cart</a>
  </div>

<div class="pt-28 sm:pt-32 pb-20 px-4 sm:px-6 max-w-full overflow-hidden">
  <div class="max-w-7xl mx-auto" id="product-container">
    <div class="py-20 text-center text-[var(--muted)] animate-pulse">Synchronizing asset details...</div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50"></div>

<footer class="py-16 px-6 border-t border-[var(--border)] bg-[var(--surface)] text-center">
  <div class="flex items-center justify-center gap-3 mb-4">
    <img src="logo.png" alt="GOGO MART" class="w-12 h-12 object-contain rounded-full border border-orange-500/30">
    <span class="font-display text-3xl font-black text-[var(--accent)]" style="font-family:'Plus Jakarta Sans', sans-serif">GOGO MART</span>
  </div>
  <p class="text-[10px] text-[var(--muted)] uppercase tracking-widest opacity-40">© 2026 GOGO MART. Your Trusted Online Store.</p>
</footer>

<script src="supabase-config.js"></script>
<script>
let PRODUCT = null;
let qty = 1;

async function loadProduct() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return location.href = 'products.html';

  try {
    if (typeof getSupabase !== 'function') return setTimeout(loadProduct, 200);
    var sb = getSupabase();
    if (!sb) return setTimeout(loadProduct, 200);

    const { data, error } = await sb.from('products').select('*').eq('id', id).single();
    if (error) throw error;
    PRODUCT = data;
    await loadReviews(id);
    renderProduct();
    updateCartCount();
  } catch (err) {
    console.error(err);
    document.getElementById('product-container').innerHTML = '<div class="py-20 text-center text-red-500 font-bold">⚠️ Data sync failure. <a href="products.html" class="underline">Catalogue Home</a></div>';
  }
}


function getStockInfo(stock) {
  const s = Number(stock !== undefined && stock !== null ? stock : 0);
  if (s <= 0) {
    return {
      statusText: 'Out of Stock',
      badgeHtml: '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-red-100 text-red-600 border border-red-200"><span class="w-2 h-2 rounded-full bg-red-500"></span>Out of stock</span>',
      isOut: true,
      maxQty: 0
    };
  } else if (s < 5) {
    return {
      statusText: `Only ${s} Left!`,
      badgeHtml: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-amber-100 text-amber-700 border border-amber-200 animate-pulse"><span class="w-2 h-2 rounded-full bg-amber-500"></span>Only ${s} item(s) left in stock!</span>`,
      isOut: false,
      maxQty: s
    };
  } else {
    return {
      statusText: 'In Stock',
      badgeHtml: '<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-700 border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>In Stock</span>',
      isOut: false,
      maxQty: s
    };
  }
}


function formatDescription(desc) {
  if (!desc) return '<p>Quality guaranteed. Carefully packed and delivered fresh to your doorstep by GOGO MART.</p>';
  
  // If description already has HTML tags like <p>, <ul>, <li>, <br>
  if (/<[a-z][\s\S]*>/i.test(desc)) {
    return desc;
  }

  // Split lines
  const lines = desc.split('\n');
  let html = '';
  let inList = false;

  lines.forEach(line => {
    const trimmed = line.trim();
    
    // Check if it's a bullet point (- or * or •)
    if (/^[-*•]\s+/.test(trimmed)) {
      if (!inList) {
        html += '<ul class="list-disc list-inside space-y-1.5 my-2 pl-1">';
        inList = true;
      }
      const itemText = trimmed.replace(/^[-*•]\s+/, '');
      html += `<li>${itemText}</li>`;
    } 
    // Check if it's a numbered list (1. or 2.)
    else if (/^\d+\.\s+/.test(trimmed)) {
      if (!inList) {
        html += '<ol class="list-decimal list-inside space-y-1.5 my-2 pl-1">';
        inList = true;
      }
      const itemText = trimmed.replace(/^\d+\.\s+/, '');
      html += `<li>${itemText}</li>`;
    } 
    else {
      if (inList) {
        html += inList === 'ol' ? '</ol>' : '</ul>';
        inList = false;
      }
      if (trimmed.length > 0) {
        html += `<p class="mb-2.5 last:mb-0">${trimmed}</p>`;
      } else {
        html += '<div class="h-2"></div>'; // empty spacer
      }
    }
  });

  if (inList) {
    html += inList === 'ol' ? '</ol>' : '</ul>';
  }

  return html;
}

function renderProduct() {
  const container = document.getElementById('product-container');
  const stockInfo = getStockInfo(PRODUCT.stock);

  // Extract video if present in images or description
  let rawImages = (PRODUCT.images && PRODUCT.images.length) ? PRODUCT.images : [PRODUCT.image_url];
  let productVideoUrl = null;
  let cleanImages = [];

  rawImages.forEach(img => {
    if (typeof img === 'string' && img.startsWith('VIDEO:')) {
      productVideoUrl = img.substring(6);
    } else if (img && typeof img === 'string' && img.trim().length > 0) {
      cleanImages.push(img);
    }
  });

  if (!productVideoUrl && PRODUCT.description) {
    const vMatch = PRODUCT.description.match(/<!--VIDEO:([\s\S]*?)-->/);
    if (vMatch) {
      productVideoUrl = vMatch[1].trim();
    }
  }

  const cleanDescription = (PRODUCT.description || '').replace(/<!--VIDEO:[\s\S]*?-->/g, '').trim();

  if (cleanImages.length === 0) {
    cleanImages = [PRODUCT.image_url || 'logo.png'];
  }

  const images = cleanImages;
  productImagesList = images;
  currentImgIndex = 0;
  
  container.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-start w-full max-w-full overflow-hidden">
      <div class="space-y-6">
          <div id="main-img-box" class="relative group rounded-3xl sm:rounded-[36px] overflow-hidden border border-slate-200 bg-white aspect-square shadow-sm p-2 sm:p-4 flex items-center justify-center touch-pan-y cursor-grab active:cursor-grabbing">
            <img id="main-img" src="${images[0]}" alt="${PRODUCT.name}" class="w-full h-full object-contain rounded-xl sm:rounded-2xl transition-opacity duration-300 select-none pointer-events-none">

            ${images.length > 1 ? `
            <!-- Left Arrow Button -->
            <button type="button" onclick="navigateImg(-1)" aria-label="Previous image" class="absolute left-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/90 hover:bg-white text-slate-800 hover:text-blue-600 shadow-lg shadow-black/10 border border-slate-200/80 backdrop-blur-md flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 z-10 focus:outline-none">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>

            <!-- Right Arrow Button -->
            <button type="button" onclick="navigateImg(1)" aria-label="Next image" class="absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/90 hover:bg-white text-slate-800 hover:text-blue-600 shadow-lg shadow-black/10 border border-slate-200/80 backdrop-blur-md flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 z-10 focus:outline-none">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </button>

            <!-- Image Index Counter Badge (e.g. 1 / 4) -->
            <div id="img-counter" class="absolute bottom-6 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-[11px] font-bold tracking-widest pointer-events-none transition-opacity">
              1 / ${images.length}
            </div>
            ` : ''}
          </div>
          ${images.length > 1 ? `
          <div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
            ${images.map((url, i) => `
                <div class="thumbnail ${i === 0 ? 'active' : ''} bg-white p-1 border border-slate-200 cursor-pointer rounded-xl transition-all" onclick="selectImgByIndex(${i})">
                    <img src="${url}" class="w-full h-full object-cover rounded-lg">
                </div>
            `).join('')}
          </div>
          ` : ''}

          ${productVideoUrl ? `
          <!-- Product Showcase Video Player -->
          <div class="mt-6 rounded-3xl overflow-hidden border border-slate-200 bg-black shadow-lg">
            <div class="p-3 bg-slate-900/90 text-white flex items-center justify-between border-b border-slate-800">
              <span class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                Official Product Video
              </span>
              <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">HD Video Preview</span>
            </div>
            <div class="aspect-video w-full bg-black flex items-center justify-center">
              <video src="${productVideoUrl}" controls preload="metadata" class="w-full h-full object-contain"></video>
            </div>
          </div>
          ` : ''}
      </div>

      <div class="space-y-8 text-slate-900">
        <div>
          ${PRODUCT.badge ? `<span class="badge mb-4 inline-block">${PRODUCT.badge}</span>` : ''}
          <div class="flex items-center gap-3 mb-3">
            <span class="text-blue-600 font-black tracking-[0.2em] uppercase text-xs">${PRODUCT.category_slug}</span>
            <span class="text-slate-300">•</span>
            <a href="#reviews-section" class="flex items-center gap-1.5 text-xs font-bold text-amber-500 hover:text-amber-600 transition-colors">
              ${REVIEWS.length > 0 ? `
                <span class="flex items-center text-amber-400">
                  ${renderStarRating(calcAvgRating())}
                </span>
                <span class="text-slate-700 font-extrabold ml-1">${calcAvgRating().toFixed(1)}</span>
                <span class="text-slate-400 font-medium">(${REVIEWS.length} ${REVIEWS.length === 1 ? 'Review' : 'Reviews'})</span>
              ` : `
                <span class="flex items-center text-slate-300">★★★★★</span>
                <span class="text-blue-600 font-medium hover:underline">Be the first to review</span>
              `}
            </a>
          </div>
          <h1 class="text-4xl lg:text-5xl font-black mb-6 font-display leading-tight text-slate-900" style="font-family:'Plus Jakarta Sans', sans-serif">${PRODUCT.name}</h1>
          <div class="flex items-center gap-4 mb-3">
            <div class="flex items-baseline gap-4">
              <span class="text-4xl font-black text-blue-600">${formatPrice(PRODUCT.price)}</span>
              ${PRODUCT.old_price ? `<span class="text-xl line-through text-slate-400">${formatPrice(PRODUCT.old_price)}</span>` : ''}
            </div>
            <div>${stockInfo.badgeHtml}</div>
          </div>
          <div class="p-6 rounded-3xl bg-white border border-slate-200/90 leading-relaxed text-slate-600 text-base shadow-sm whitespace-pre-line prose max-w-none">
            ${formatDescription(cleanDescription)}
          </div>
        </div>
        
        <div class="p-8 rounded-[32px] bg-gradient-to-br from-blue-50/80 via-white to-pink-50/50 border border-slate-200 space-y-6 shadow-md shadow-blue-500/5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-widest text-slate-500">Select Quantity</span>
            <div class="flex items-center gap-4 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
              <button onclick="changeQty(-1)" class="qty-btn">－</button>
              <span id="qty-display" class="w-8 text-center font-black text-slate-900">${qty}</span>
              <button onclick="changeQty(1)" class="qty-btn">＋</button>
            </div>
          </div>
                    ${stockInfo.isOut ? `
            <div class="p-4 rounded-2xl bg-red-50 border border-red-200 text-center">
              <p class="text-sm font-black text-red-600">This item is currently Out of Stock.</p>
              <p class="text-xs text-slate-500 mt-1">Please check back later or explore other products.</p>
            </div>
            <button disabled class="w-full py-4 rounded-2xl bg-slate-200 text-slate-400 font-black text-base cursor-not-allowed">
              Currently Unavailable
            </button>
          ` : `
            <div class="grid sm:grid-cols-2 gap-4">
              <button onclick="addToCart()" class="w-full py-4 rounded-2xl border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-black text-base transition-all flex items-center justify-center gap-2">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                Add To Cart
              </button>
              <button onclick="buyNow()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 via-pink-500 to-amber-500 hover:opacity-95 text-white font-black text-base transition-all shadow-xl shadow-blue-500/25 flex items-center justify-center gap-2">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Buy Now
              </button>
            </div>
          `}
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div class="p-4 rounded-2xl bg-white border border-slate-200 text-center shadow-sm hover:border-blue-400 hover:shadow-md transition-all">
            <span class="text-xl mb-1.5 block">💎</span>
            <p class="text-[10px] font-bold uppercase tracking-wider text-slate-700">Quality Products</p>
          </div>
          <div class="p-4 rounded-2xl bg-white border border-slate-200 text-center shadow-sm hover:border-pink-400 hover:shadow-md transition-all">
            <span class="text-xl mb-1.5 block">🏷️</span>
            <p class="text-[10px] font-bold uppercase tracking-wider text-slate-700">Best Prices</p>
          </div>
          <div class="p-4 rounded-2xl bg-white border border-slate-200 text-center shadow-sm hover:border-amber-400 hover:shadow-md transition-all">
            <span class="text-xl mb-1.5 block">🛡️</span>
            <p class="text-[10px] font-bold uppercase tracking-wider text-slate-700">Peace of Mind</p>
          </div>
        </div>
      </div>
    </div>

    <!-- CUSTOMER REVIEWS & RATING SECTION -->
    <div id="reviews-section" class="mt-20 pt-16 border-t border-slate-200">
      <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            <span class="text-xs font-bold uppercase tracking-widest text-blue-600">Verified Feedback</span>
          </div>
          <h2 class="text-3xl lg:text-4xl font-black text-slate-900 font-display">Customer Reviews</h2>
          <p class="text-slate-500 text-sm mt-1">Real ratings and experiences shared by our valued shoppers.</p>
        </div>
        <div class="flex items-center gap-5 p-4 px-6 bg-slate-50 border border-slate-200 rounded-3xl">
          <div class="text-center">
            <span class="text-4xl font-black text-slate-900">${REVIEWS.length > 0 ? calcAvgRating().toFixed(1) : '—'}</span>
            <span class="text-xs text-slate-400 block font-bold">${REVIEWS.length > 0 ? 'out of 5' : 'No ratings'}</span>
          </div>
          <div class="border-l border-slate-200 pl-5">
            <div class="flex items-center text-amber-400 text-base mb-1">
              ${renderStarRating(calcAvgRating())}
            </div>
            <span class="text-xs font-bold text-slate-500">${REVIEWS.length > 0 ? `Based on ${REVIEWS.length} review(s)` : 'Awaiting first review'}</span>
          </div>
        </div>
      </div>

      <div class="grid lg:grid-cols-12 gap-12 items-start">
        <!-- Reviews List (Left / Col-7) -->
        <div class="lg:col-span-7 space-y-5">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-black text-slate-900">What People Say (${REVIEWS.length})</h3>
          </div>

let currentImgIndex = 0;
let productImagesList = [];

function selectImgByIndex(index) {
  if (!productImagesList.length) return;
  if (index < 0) index = productImagesList.length - 1;
  if (index >= productImagesList.length) index = 0;
  
  currentImgIndex = index;
  const main = document.getElementById('main-img');
  if (main) {
    main.style.opacity = '0.3';
    setTimeout(() => {
      main.src = productImagesList[currentImgIndex];
      main.style.opacity = '1';
    }, 120);
  }

  // Update thumbnails
  const thumbs = document.querySelectorAll('.thumbnail');
  thumbs.forEach((t, i) => {
    if (i === currentImgIndex) {
      t.classList.add('active');
      t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    } else {
      t.classList.remove('active');
    }
  });

  // Update Counter badge
  const counter = document.getElementById('img-counter');
  if (counter) {
    counter.textContent = `${currentImgIndex + 1} / ${productImagesList.length}`;
  }
}

function navigateImg(delta) {
  selectImgByIndex(currentImgIndex + delta);
}

function changeImg(url, el) {
  const idx = productImagesList.indexOf(url);
  if (idx !== -1) selectImgByIndex(idx);
}

// Touch swipe gesture support for mobile devices
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

function setupImageTouchGestures() {
  const box = document.getElementById('main-img-box');
  if (!box) return;

  box.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  box.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleImageSwipe();
  }, { passive: true });
}

function handleImageSwipe() {
  const diffX = touchEndX - touchStartX;
  const diffY = touchEndY - touchStartY;
  
  // Only trigger horizontal swipe if movement is predominantly horizontal and > 35px
  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
    if (diffX < 0) {
      // Swiped Left -> Next Image
      navigateImg(1);
    } else {
      // Swiped Right -> Previous Image
      navigateImg(-1);
    }
  }
}

// Keyboard arrows navigation support
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navigateImg(-1);
  if (e.key === 'ArrowRight') navigateImg(1);
});

function changeQty(d) {
  const maxStock = PRODUCT && PRODUCT.stock !== undefined ? PRODUCT.stock : 999;
  if (d > 0 && qty >= maxStock) {
    showToast('⚠️ Max stock limit reached: ' + maxStock);
    return;
  }
  qty = Math.max(1, qty + d);
  const display = document.getElementById('qty-display');
  if (display) display.textContent = qty;
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
  document.querySelectorAll('#cart-count').forEach(el => el.textContent = cart.reduce((s, i) => s + i.qty, 0));
}

function buyNow() {
  if (!PRODUCT) return;
  const cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
  const ex = cart.find(x => x.id == PRODUCT.id);
  if (ex) ex.qty += qty;
  else cart.push({ ...PRODUCT, qty: qty });
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  updateCartCount();
  window.location.href = 'checkout.html';
}
function addToCart() {
  const cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
  const ex = cart.find(x => x.id == PRODUCT.id);
  if (ex) ex.qty += qty; else cart.push({ ...PRODUCT, qty: qty });
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  updateCartCount();
  showToast('🛒 Selection appended to basket.');
}

function showToast(m) {
  const t = document.createElement('div');
  t.className = 'p-5 bg-orange-600 text-white rounded-2xl shadow-2xl font-bold mb-3 border border-orange-400/20 backdrop-blur-xl';
  t.textContent = m; document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}


let REVIEWS = [];
let currentSelectedRating = 5;

// Load reviews from Supabase or localStorage
async function loadReviews(prodId) {
  try {
    const sb = getSupabase();
    if (sb) {
      const { data, error } = await sb.from('reviews').select('*').eq('product_id', prodId).order('created_at', { ascending: false });
      if (!error && data) {
        REVIEWS = data;
        return;
      }
    }
  } catch (err) {
    console.warn('Reviews table not available in DB, using local reviews', err);
  }

  // Clear legacy seed dummy reviews from localStorage if they contain sample names
  let local = JSON.parse(localStorage.getItem('gogo-reviews-' + prodId) || '[]');
  local = local.filter(r => r.author_name !== 'Nimasha Fernando' && r.author_name !== 'Damith Bandara');
  localStorage.setItem('gogo-reviews-' + prodId, JSON.stringify(local));
  REVIEWS = local;
}

function calcAvgRating() {
  if (!REVIEWS || REVIEWS.length === 0) return 0;
  const sum = REVIEWS.reduce((acc, r) => acc + Number(r.rating || 5), 0);
  return sum / REVIEWS.length;
}

function renderStarRating(rating) {
  const rounded = Math.round(rating);
  let stars = '';
  for (let i = 1; i <= 5; i++) {
    if (i <= rounded) stars += '★';
    else stars += '<span class="text-slate-200">★</span>';
  }
  return stars;
}

function renderReviewsList() {
  if (!REVIEWS || REVIEWS.length === 0) {
    return `
      <div class="p-8 text-center bg-slate-50 border border-slate-200 rounded-3xl text-slate-400">
        <p class="font-bold text-sm">No reviews yet.</p>
        <p class="text-xs mt-1">Be the first to share your thoughts on this product!</p>
      </div>
    `;
  }

  return REVIEWS.map(r => {
    const d = new Date(r.created_at || Date.now()).toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
    const initials = (r.author_name || 'Anonymous').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
    return `
      <div class="p-6 rounded-3xl bg-white border border-slate-200/90 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-pink-500 text-white font-black text-xs flex items-center justify-center shadow-sm">
              ${initials}
            </div>
            <div>
              <h5 class="font-bold text-sm text-slate-900">${r.author_name || 'Customer'}</h5>
              <p class="text-[11px] text-slate-400 font-medium">${d}</p>
            </div>
          </div>
          <div class="flex items-center text-amber-400 text-sm font-black">
            ${renderStarRating(r.rating)}
          </div>
        </div>
        <p class="text-slate-600 text-sm leading-relaxed">${r.comment}</p>
        ${(r.images && r.images.length > 0) ? `
          <div class="flex gap-2.5 overflow-x-auto pt-2 pb-1">
            ${r.images.map(imgUrl => `
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden border border-slate-200 bg-slate-100 shrink-0 cursor-pointer hover:opacity-90 hover:scale-105 transition-all shadow-sm" onclick="openPhotoModal('${imgUrl}')">
                <img src="${imgUrl}" alt="Review photo" class="w-full h-full object-cover">
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function setRating(val) {
  currentSelectedRating = val;
  const input = document.getElementById('r-rating');
  if (input) input.value = val;
  updateStarPicker(val);
}

function hoverRating(val) {
  updateStarPicker(val);
}

function resetHoverRating() {
  updateStarPicker(currentSelectedRating);
}

function updateStarPicker(val) {
  const container = document.getElementById('star-picker');
  if (!container) return;
  const labels = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent!'];
  const labelEl = document.getElementById('rating-label');
  if (labelEl) labelEl.textContent = `${val}/5 - ${labels[val] || ''}`;

  container.querySelectorAll('.star-btn').forEach(btn => {
    const btnVal = Number(btn.getAttribute('data-val'));
    const icon = btn.querySelector('.star-icon');
    if (btnVal <= val) {
      icon.className = 'star-icon text-amber-400';
    } else {
      icon.className = 'star-icon text-slate-200';
    }
  });
}

let reviewSelectedPhotos = []; // array of { file, dataUrl }

function handleReviewPhotosSelect(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      reviewSelectedPhotos.push({ file: file, dataUrl: e.target.result });
      renderReviewPhotoPreviews();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function removeReviewPhoto(idx) {
  reviewSelectedPhotos.splice(idx, 1);
  renderReviewPhotoPreviews();
}

function renderReviewPhotoPreviews() {
  const container = document.getElementById('review-photos-preview');
  const countBadge = document.getElementById('review-img-count');
  if (!container) return;

  if (countBadge) countBadge.textContent = `${reviewSelectedPhotos.length} added`;

  if (reviewSelectedPhotos.length === 0) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }

  container.classList.remove('hidden');
  container.innerHTML = reviewSelectedPhotos.map((item, idx) => `
    <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-slate-300 bg-slate-100 shrink-0 shadow-sm">
      <img src="${item.dataUrl}" class="w-full h-full object-cover">
      <button type="button" onclick="removeReviewPhoto(${idx})" class="absolute top-1 right-1 w-4 h-4 rounded-full bg-red-600 text-white flex items-center justify-center text-[10px] font-bold shadow">✕</button>
    </div>
  `).join('');
}

function openPhotoModal(imgUrl) {
  const existing = document.getElementById('photo-modal');
  if (existing) existing.remove();

  const modalHtml = `
    <div id="photo-modal" class="fixed inset-0 z-[3000] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="this.remove()">
      <div class="relative max-w-2xl w-full max-h-[85vh] flex items-center justify-center" onclick="event.stopPropagation()">
        <img src="${imgUrl}" alt="Customer photo" class="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl border border-white/20">
        <button onclick="document.getElementById('photo-modal').remove()" class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-white text-slate-900 font-black flex items-center justify-center shadow-lg hover:bg-slate-200">✕</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
}

async function submitReview(e) {
  e.preventDefault();
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const comment = document.getElementById('r-comment').value.trim();
  const rating = Number(document.getElementById('r-rating').value || 5);
  const btn = document.getElementById('submit-review-btn');

  if (!name || !email || !comment) {
    alert('Please complete all required fields.');
    return;
  }

  btn.textContent = 'Posting review...';
  btn.disabled = true;

  // Process photos (upload to Supabase storage 'products' bucket if possible, or fallback to dataUrl)
  const finalPhotoUrls = [];
  const sb = typeof getSupabase === 'function' ? getSupabase() : null;

  for (const item of reviewSelectedPhotos) {
    let photoUrl = item.dataUrl;
    if (sb && sb.storage && item.file) {
      try {
        const ext = item.file.name.split('.').pop() || 'jpg';
        const fn = `rev-${PRODUCT.id}-${Date.now()}-${Math.random().toString(36).substring(7)}.${ext}`;
        const { data: upData, error: upErr } = await sb.storage.from('products').upload(fn, item.file);
        if (!upErr) {
          const { data: pubData } = sb.storage.from('products').getPublicUrl(fn);
          if (pubData && pubData.publicUrl) photoUrl = pubData.publicUrl;
        }
      } catch (stErr) {
        console.warn('Storage upload bypass, keeping base64');
      }
    }
    finalPhotoUrls.push(photoUrl);
  }

  const newReview = {
    id: Date.now(),
    product_id: PRODUCT.id,
    author_name: name,
    author_email: email, // Saved securely, never displayed to public
    rating: rating,
    comment: comment,
    images: finalPhotoUrls,
    created_at: new Date().toISOString()
  };

  // 1. Try DB
  try {
    if (sb) {
      await sb.from('reviews').insert({
        product_id: PRODUCT.id,
        author_name: name,
        author_email: email,
        rating: rating,
        comment: comment,
        images: finalPhotoUrls
      });
    }
  } catch (err) {
    console.warn('DB insert bypassed, storing locally', err);
  }

  // 2. Local persistence
  REVIEWS.unshift(newReview);
  localStorage.setItem('gogo-reviews-' + PRODUCT.id, JSON.stringify(REVIEWS));

  showToast('✅ Review submitted with photos! Thank you.');
  reviewSelectedPhotos = [];
  btn.textContent = 'Submit Review';
  btn.disabled = false;

  // Re-render
  renderProduct();

  // Scroll to reviews
  setTimeout(() => {
    document.getElementById('reviews-section').scrollIntoView({ behavior: 'smooth' });
  }, 100);
}

loadProduct();
</script>

<script>
let LIVE_SEARCH_PRODUCTS = [];

async function initLiveSearchData() {
  if (LIVE_SEARCH_PRODUCTS.length > 0) return;
  try {
    const sb = typeof getSupabase === 'function' ? getSupabase() : null;
    if (sb) {
      const { data } = await sb.from('products').select('id, name, price, old_price, category_slug, image_url');
      if (data) LIVE_SEARCH_PRODUCTS = data;
    }
  } catch (err) {
    console.warn('Live search fetch error:', err);
  }
}

function handleLiveSearch(query) {
  query = (query || '').trim().toLowerCase();
  const dropdown = document.getElementById('live-search-dropdown');
  const resultsContainer = document.getElementById('live-search-results');
  const viewAllLink = document.getElementById('view-all-search-link');
  if (!dropdown || !resultsContainer) return;

  if (query.length === 0) {
    dropdown.classList.add('hidden');
    return;
  }

  // Filter products
  const matches = LIVE_SEARCH_PRODUCTS.filter(p => 
    (p.name && p.name.toLowerCase().includes(query)) ||
    (p.category_slug && p.category_slug.toLowerCase().includes(query))
  ).slice(0, 5);

  if (matches.length === 0) {
    resultsContainer.innerHTML = `
      <div class="p-4 text-center text-slate-400">
        <p class="text-xs font-semibold">No products found for "${query}"</p>
        <p class="text-[10px] text-slate-400 mt-0.5">Try a different keyword</p>
      </div>
    `;
    if (viewAllLink) viewAllLink.classList.add('hidden');
  } else {
    resultsContainer.innerHTML = matches.map(p => `
      <a href="product-detail.html?id=${p.id}" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-blue-50/70 transition-colors group">
        <img src="${p.image_url || 'logo.png'}" alt="${p.name}" class="w-11 h-11 rounded-lg object-cover border border-slate-200 bg-white shrink-0 group-hover:scale-105 transition-transform">
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold text-slate-900 group-hover:text-blue-600 truncate">${p.name}</p>
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">${p.category_slug || ''}</p>
        </div>
        <div class="text-right shrink-0">
          <span class="text-xs font-black text-blue-600">${typeof formatPrice === 'function' ? formatPrice(p.price) : 'Rs. ' + p.price}</span>
        </div>
      </a>
    `).join('');
    if (viewAllLink) {
      viewAllLink.classList.remove('hidden');
      viewAllLink.href = 'products.html?q=' + encodeURIComponent(query);
      viewAllLink.textContent = `View all results for "${query}" →`;
    }
  }

  dropdown.classList.remove('hidden');
}

function handleNavSearch(e, form) {
  e.preventDefault();
  const input = form.querySelector('input[name="q"]');
  const query = input ? input.value.trim() : '';
  if (query) {
    window.location.href = 'products.html?q=' + encodeURIComponent(query);
  } else {
    window.location.href = 'products.html';
  }
  return false;
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const container = document.getElementById('nav-search-container');
  const dropdown = document.getElementById('live-search-dropdown');
  if (container && dropdown && !container.contains(e.target)) {
    dropdown.classList.add('hidden');
  }
});

// Also trigger live search on focus or load
if (typeof initLiveSearchData === 'function') {
  initLiveSearchData();
}
</script>
