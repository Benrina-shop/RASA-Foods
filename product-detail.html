<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--gold:#f59e0b;--cream:#fef3c7;--muted:#8a6840}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.2rem 1.5rem;background:rgba(8,3,0,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:500;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--cream)}
    .main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px}
    .qty-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--cream);cursor:pointer}
    #mob-menu{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
    #mob-menu.open{display:flex}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl font-bold" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Foods</span></a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
    </div>
    <div class="flex items-center gap-3">
      <a href="cart.html" class="relative p-2 nav-link">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cart-count" class="absolute -top-1 -right-1 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold bg-[var(--accent)]">0</span>
      </a>
    </div>
  </div>
</nav>

<section class="pt-32 pb-16 px-6">
  <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12" id="product-detail-view">
    <div class="animate-pulse bg-[var(--surface)] aspect-square rounded-3xl"></div>
    <div class="animate-pulse space-y-4">
      <div class="h-8 bg-[var(--surface)] w-1/2 rounded"></div>
      <div class="h-4 bg-[var(--surface)] w-full rounded"></div>
      <div class="h-4 bg-[var(--surface)] w-full rounded"></div>
    </div>
  </div>
</section>

<div id="toast" class="fixed bottom-6 right-6 z-50"></div>

<script src="supabase-config.js"></script>
<script>
let currentProduct = null;
let qty = 1;

async function loadProduct() {
  const id = new URLSearchParams(location.search).get('id');
  if(!id) return location.href = 'products.html';

  const { data, error } = await supabase.from('products').select('*').eq('id', id).single();
  if(error) return console.error(error);
  
  currentProduct = data;
  renderProduct();
}

function renderProduct() {
  const p = currentProduct;
  document.getElementById('product-detail-view').innerHTML = `
    <div>
      <img src="${p.image_url}" class="main-img" alt="${p.name}">
    </div>
    <div>
      <p class="text-xs uppercase tracking-widest mb-2 text-[var(--accent)]">${p.category_slug}</p>
      <h1 class="font-display text-4xl font-bold mb-4" style="font-family:'Playfair Display',serif">${p.name}</h1>
      <p class="text-2xl font-bold text-[var(--accent)] mb-6">${formatPrice(p.price)}</p>
      <p class="text-sm text-[var(--muted)] leading-relaxed mb-8">${p.description || 'No description available.'}</p>
      
      <div class="flex items-center gap-6 mb-8">
        <div class="flex items-center gap-3 p-1 bg-[var(--surface)] rounded-full border border-[var(--border)]">
          <button onclick="updateQty(-1)" class="qty-btn">−</button>
          <span id="qty-display" class="font-bold w-6 text-center">${qty}</span>
          <button onclick="updateQty(1)" class="qty-btn">+</button>
        </div>
        <button onclick="addToCart()" class="flex-1 py-4 bg-orange-500 text-white font-bold rounded-2xl hover:bg-orange-600 transition-colors">Add to Cart</button>
      </div>
      
      <div class="grid grid-cols-2 gap-4 text-xs text-[var(--muted)]">
        <div class="p-3 bg-[var(--surface)] rounded-xl border border-[var(--border)]">🚚 Fast Delivery</div>
        <div class="p-3 bg-[var(--surface)] rounded-xl border border-[var(--border)]">✅ 100% Authentic</div>
      </div>
    </div>
  `;
}

function updateQty(delta) {
  qty = Math.max(1, qty + delta);
  if(document.getElementById('qty-display')) document.getElementById('qty-display').textContent = qty;
}

let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
function updateCartCount() { document.querySelectorAll('#cart-count').forEach(el => el.textContent = cart.reduce((s, i) => s + i.qty, 0)); }
function addToCart() {
  const p = currentProduct;
  const ex = cart.find(x => x.id == p.id);
  if (ex) ex.qty += qty; else cart.push({ ...p, qty: qty });
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  updateCartCount();
  showToast('🛒 Added ' + qty + ' items to cart');
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'p-3 bg-orange-500 text-white rounded-lg shadow-lg mb-2';
  t.textContent = msg; document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

loadProduct();
updateCartCount();
</script>
</body>
</html>
