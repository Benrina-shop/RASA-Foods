<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — RASA Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020100;--surface:#0a0501;--surface2:#110802;--border:#1f1105;--accent:#f97316;--cream:#fef3c7;--muted:#6b5a4d}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2.5rem 1.5rem}
    .main-content{margin-left:280px;padding:3rem 4rem;min-height:100vh}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.85rem 1.25rem;border-radius:14px;color:var(--muted);transition:all .3s;margin-bottom:.5rem;font-weight:500;font-size:.9rem}
    .nav-link:hover, .nav-link.active{background:rgba(249,115,22,.08);color:var(--accent)}
    .input-field{width:100%;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--cream);outline:none;margin-bottom:1.25rem;font-size:.875rem;transition:border-color .2s}
    .input-field:focus{border-color:var(--accent)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:2rem}
    .modal.open{display:flex}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="product-modal" class="modal">
    <div class="bg-[var(--surface)] p-10 rounded-3xl border border-[var(--border)] w-full max-w-xl shadow-2xl">
      <h2 id="modal-title" class="text-3xl font-black mb-8 font-display" style="font-family:'Playfair Display',serif">Add Product</h2>
      <form id="product-form">
        <input type="hidden" id="p-id">
        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Display Name</label>
                <input type="text" id="p-name" placeholder="Authentic Dark Chocolate" required class="input-field">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Category</label>
                <select id="p-cat" required class="input-field">
                    <option value="snacks">Snacks</option>
                    <option value="sweets">Sweets</option>
                    <option value="beverages">Beverages</option>
                    <option value="spices">Spices</option>
                    <option value="bakery">Bakery</option>
                    <option value="organic">Organic</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Base Price (Rs.)</label>
                <input type="number" id="p-price" placeholder="1500" required class="input-field">
            </div>
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Asset Image URL</label>
            <input type="text" id="p-img" placeholder="https://..." required class="input-field">
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Product Story / Description</label>
            <textarea id="p-desc" placeholder="Tell the product's story..." class="input-field h-32"></textarea>
        </div>
        <div class="flex gap-4 mt-8">
          <button type="button" onclick="closeModal()" class="flex-1 py-4 bg-transparent border border-[var(--border)] rounded-xl font-bold">Cancel</button>
          <button type="submit" class="flex-1 py-4 bg-orange-500 text-white font-bold rounded-xl shadow-lg shadow-orange-500/20">Save Asset</button>
        </div>
      </form>
    </div>
  </div>

  <div class="sidebar flex flex-col justify-between">
    <div>
        <div class="font-display text-2xl font-black mb-12 flex items-center gap-2" style="font-family:'Playfair Display',serif">
            <span class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white text-lg">R</span>
            RASA <span class="text-xs font-normal opacity-40 tracking-widest uppercase">Admin</span>
        </div>
        <nav>
          <a href="admin-dashboard.html" class="nav-link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-width="2"/></svg>
              Dashboard
          </a>
          <a href="admin-products.html" class="nav-link active">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2"/></svg>
              Products
          </a>
          <a href="admin-orders.html" class="nav-link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg>
              Orders
          </a>
        </nav>
    </div>
    <a href="index.html" class="nav-link">← Storefront</a>
  </div>

  <main class="main-content">
    <div class="flex justify-between items-end mb-12">
      <div>
          <h1 class="text-4xl font-black mb-2" style="font-family:'Playfair Display',serif">Catalogue</h1>
          <p class="text-sm text-[var(--muted)]">Manage your available stock and product listings.</p>
      </div>
      <button onclick="openModal()" class="px-8 py-4 bg-orange-500 text-white font-black rounded-2xl shadow-xl shadow-orange-500/10 hover:scale-105 transition-all">+ Add Product</button>
    </div>
    
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-3xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-white/5 text-[10px] uppercase tracking-[.2em] text-[var(--muted)] font-bold">
          <tr>
            <th class="p-6">Collection Item</th>
            <th class="p-6">Classification</th>
            <th class="p-6">Valuation</th>
            <th class="p-6 text-right">Operations</th>
          </tr>
        </thead>
        <tbody id="products-table" class="divide-y divide-[var(--border)]">
            <tr><td colspan="4" class="p-10 text-center text-[var(--muted)] animate-pulse">Syncing with database...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
if (!localStorage.getItem('isAdmin')) location.href = 'admin-login.html';
let allProducts = [];

async function initProducts() {
  try {
    if (typeof getSupabase !== 'function') return setTimeout(initProducts, 200);
    var sb = getSupabase();
    if (!sb) return setTimeout(initProducts, 200);

    const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
    if (data) {
        allProducts = data;
        renderTable();
    }
  } catch (err) { console.error(err); }
}

function renderTable() {
    document.getElementById('products-table').innerHTML = allProducts.map(p => `
      <tr class="hover:bg-white/5 transition-colors">
        <td class="p-6">
          <div class="flex items-center gap-4">
            <img src="${p.image_url}" class="w-12 h-12 rounded-xl object-cover border border-[var(--border)]">
            <div>
                <p class="font-bold text-white">${p.name}</p>
                <p class="text-[10px] text-[var(--muted)]">ID: #ORD-${p.id}</p>
            </div>
          </div>
        </td>
        <td class="p-6">
            <span class="px-3 py-1 bg-white/5 rounded-full text-[10px] uppercase font-bold text-[var(--muted)]">${p.category_slug}</span>
        </td>
        <td class="p-6 font-black text-orange-500">${formatPrice(p.price)}</td>
        <td class="p-6 text-right">
          <button onclick="editProduct(${p.id})" class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] hover:text-white mr-6">Edit</button>
          <button onclick="deleteProduct(${p.id})" class="text-[10px] font-bold uppercase tracking-widest text-red-500 hover:text-red-400">Remove</button>
        </td>
      </tr>
    `).join('');
}

function openModal(id = null) {
  const modal = document.getElementById('product-modal');
  const form = document.getElementById('product-form');
  modal.classList.add('open');
  if (id) {
    const p = allProducts.find(x => x.id == id);
    document.getElementById('modal-title').textContent = 'Modify Asset';
    document.getElementById('p-id').value = p.id;
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-cat').value = p.category_slug;
    document.getElementById('p-price').value = p.price;
    document.getElementById('p-img').value = p.image_url;
    document.getElementById('p-desc').value = p.description;
  } else {
    document.getElementById('modal-title').textContent = 'New Collection Item';
    form.reset();
    document.getElementById('p-id').value = '';
  }
}

function closeModal() { document.getElementById('product-modal').classList.remove('open'); }

document.getElementById('product-form').onsubmit = async (e) => {
  e.preventDefault();
  const id = document.getElementById('p-id').value;
  const productData = {
    name: document.getElementById('p-name').value,
    category_slug: document.getElementById('p-cat').value,
    price: document.getElementById('p-price').value,
    image_url: document.getElementById('p-img').value,
    description: document.getElementById('p-desc').value
  };

  const sb = getSupabase();
  let res;
  if (id) { res = await sb.from('products').update(productData).eq('id', id); } 
  else { res = await sb.from('products').insert(productData); }

  if (res.error) alert(res.error.message);
  else {
    closeModal();
    initProducts();
  }
};

async function deleteProduct(id) {
  if (confirm('Permanently remove this asset from the database?')) {
    const { error } = await getSupabase().from('products').delete().eq('id', id);
    if (error) alert(error.message);
    else initProducts();
  }
}

function editProduct(id) { openModal(id); }

initProducts();
</script>
</body>
</html>
