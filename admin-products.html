<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — RASA Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020100;--surface:#0a0501;--surface2:#110802;--border:#1f1105;--accent:#f97316;--cream:#fef3c7;--muted:#6b5a4d}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2.5rem 1.5rem}
    .main-content{margin-left:280px;padding:3rem 4rem;min-height:100vh}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.85rem 1.25rem;border-radius:14px;color:var(--muted);transition:all .3s;margin-bottom:.5rem;font-weight:500;font-size:.9rem}
    .nav-link:hover, .nav-link.active{background:rgba(249,115,22,.08);color:var(--accent)}
    .input-field{width:100%;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--cream);outline:none;margin-bottom:1.25rem;font-size:.875rem;transition:all .2s}
    .input-field:focus{border-color:var(--accent);background:var(--surface2)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(15px);z-index:1000;align-items:center;justify-content:center;padding:2rem}
    .modal.open{display:flex}
    .img-preview-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));gap:10px;margin-bottom:1.25rem}
    .img-preview-item{width:80px;height:80px;border-radius:10px;overflow:hidden;border:1px solid var(--border);position:relative}
    .img-preview-item img{width:100%;height:100%;object-fit:cover}
    .img-remove{position:absolute;top:2px;right:2px;background:rgba(239,68,68,.8);color:white;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer}
    .loader-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="loader" class="loader-overlay">
      <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs font-bold uppercase tracking-widest">Processing Assets...</p>
  </div>

  <div id="product-modal" class="modal">
    <div class="bg-[var(--surface)] p-10 rounded-3xl border border-[var(--border)] w-full max-w-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 id="modal-title" class="text-3xl font-black mb-8 font-display" style="font-family:'Playfair Display',serif">Add Product</h2>
      <form id="product-form">
        <input type="hidden" id="p-id">
        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Display Name</label>
                <input type="text" id="p-name" placeholder="Authentic Dark Chocolate" required class="input-field">
            </div>
            
            <div class="col-span-2 md:col-span-1">
                <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Category Selection</label>
                <div class="flex flex-col gap-2">
                    <select id="p-cat-select" class="input-field mb-0">
                        <!-- Categories dynamic -->
                    </select>
                    <button type="button" onclick="toggleNewCat()" class="text-[9px] font-bold uppercase text-orange-500 text-left hover:underline">Or Create New Category?</button>
                </div>
            </div>

            <div id="new-cat-container" class="col-span-2 md:col-span-1 hidden">
                <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">New Category Name</label>
                <input type="text" id="p-new-cat" placeholder="Enter new category name" class="input-field">
            </div>

            <div class="col-span-2 md:col-span-1">
                <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Selling Price (Rs.)</label>
                <input type="number" id="p-price" placeholder="1200" required class="input-field">
            </div>

            <div class="col-span-2 md:col-span-1">
                <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Original Price (Rs.) - Optional</label>
                <input type="number" id="p-old-price" placeholder="1500" class="input-field">
                <p class="text-[8px] text-[var(--muted)] -mt-2 uppercase font-bold tracking-widest">Leave empty if no deal active</p>
            </div>
        </div>

        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Visual Assets (Local Upload)</label>
            <input type="file" id="p-files" accept="image/*" multiple class="hidden" onchange="handleFileSelect(event)">
            <div id="img-previews" class="img-preview-grid"></div>
            <button type="button" onclick="document.getElementById('p-files').click()" class="w-full py-4 bg-transparent border-2 border-dashed border-[var(--border)] rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:border-orange-500 transition-all text-[var(--muted)] hover:text-white">
                Select Photo(s) from Device
            </button>
            <p class="text-[9px] text-[var(--muted)] mt-2 italic">Tip: You can select multiple images at once.</p>
        </div>

        <div class="mt-8">
            <label class="text-[10px] font-bold uppercase tracking-widest text-orange-500 mb-2 block">Product Story / Specs</label>
            <textarea id="p-desc" placeholder="Tell the product's story..." class="input-field h-32"></textarea>
        </div>

        <div class="flex gap-4 mt-8">
          <button type="button" onclick="closeModal()" class="flex-1 py-4 bg-transparent border border-[var(--border)] rounded-xl font-bold uppercase text-xs tracking-widest">Cancel</button>
          <button type="submit" class="flex-1 py-4 bg-orange-500 text-white font-bold rounded-xl shadow-lg shadow-orange-500/20 uppercase text-xs tracking-widest">Synchronize</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar flex flex-col justify-between">
    <div>
        <div class="font-display text-2xl font-black mb-12 flex items-center gap-2" style="font-family:'Playfair Display',serif">
            <span class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white text-lg">R</span>
            RASA <span class="text-xs font-normal opacity-40 tracking-widest uppercase">Admin</span>
        </div>
        <nav>
          <a href="admin-dashboard.html" class="nav-link"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-width="2"/></svg> Dashboard</a>
          <a href="admin-products.html" class="nav-link active"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2"/></svg> Products</a>
          <a href="admin-orders.html" class="nav-link"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg> Orders</a>
          <a href="admin-offers.html" class="nav-link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" stroke-width="2"/></svg>
              Offers
          </a>
        </nav>
    </div>
    <a href="index.html" class="nav-link">← Storefront</a>
  </div>

  <main class="main-content">
    <div class="flex justify-between items-end mb-12">
      <div>
          <h1 class="text-4xl font-black mb-2" style="font-family:'Playfair Display',serif">Inventory</h1>
          <p class="text-sm text-[var(--muted)]">Manage your available stock and product listings.</p>
      </div>
      <button onclick="openModal()" class="px-8 py-4 bg-orange-500 text-white font-black rounded-2xl shadow-xl shadow-orange-500/10 hover:scale-105 transition-all">+ Add Asset</button>
    </div>
    
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-3xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-white/5 text-[10px] uppercase tracking-[.2em] text-[var(--muted)] font-bold">
          <tr>
            <th class="p-6">Item</th>
            <th class="p-6">Classification</th>
            <th class="p-6">Valuation</th>
            <th class="p-6 text-right">Operations</th>
          </tr>
        </thead>
        <tbody id="products-table" class="divide-y divide-[var(--border)]">
            <tr><td colspan="4" class="p-10 text-center text-[var(--muted)] animate-pulse">Establishing uplink...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
if (!localStorage.getItem('isAdmin')) location.href = 'admin-login.html';
let allProducts = [];
let allCategories = [];
let selectedFiles = [];
let isEditing = false;

async function initPage() {
    try {
        if (typeof getSupabase !== 'function') return setTimeout(initPage, 200);
        const sb = getSupabase();
        
        // Load Categories
        const { data: cats } = await sb.from('categories').select('*').order('name');
        allCategories = cats || [];
        updateCategoryDropdown();

        // Load Products
        const { data: prods } = await sb.from('products').select('*').order('created_at', { ascending: false });
        allProducts = prods || [];
        renderTable();

    } catch (e) { console.error(e); }
}

function updateCategoryDropdown() {
    const select = document.getElementById('p-cat-select');
    select.innerHTML = allCategories.map(c => `<option value="${c.slug}">${c.name}</option>`).join('');
}

function renderTable() {
    document.getElementById('products-table').innerHTML = allProducts.map(p => `
      <tr class="hover:bg-white/5 transition-colors">
        <td class="p-6">
          <div class="flex items-center gap-4">
            <img src="${p.image_url}" class="w-12 h-12 rounded-xl object-cover border border-[var(--border)] bg-black/20" onerror="this.src='https://placehold.co/600x400/111/f97316?text=Image'">
            <div>
                <p class="font-bold text-white">${p.name}</p>
                <p class="text-[9px] text-[var(--muted)] uppercase font-black tracking-widest">UID-${p.id}</p>
            </div>
          </div>
        </td>
        <td class="p-6"><span class="px-3 py-1 bg-white/5 rounded-full text-[10px] uppercase font-bold text-[var(--muted)] tracking-wider">${p.category_slug}</span></td>
        <td class="p-6 font-black text-orange-500">${formatPrice(p.price)}</td>
        <td class="p-6 text-right">
          <button onclick="editProduct(${p.id})" class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] hover:text-white mr-6">Modify</button>
          <button onclick="deleteProduct(${p.id})" class="text-[10px] font-bold uppercase tracking-widest text-red-500">Remove</button>
        </td>
      </tr>
    `).join('');
}

function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedFiles.push({ file, preview: e.target.result });
            renderPreviews();
        };
        reader.readAsDataURL(file);
    });
}

function renderPreviews() {
    const grid = document.getElementById('img-previews');
    grid.innerHTML = selectedFiles.map((f, index) => `
        <div class="img-preview-item">
            <img src="${f.preview}">
            <div class="img-remove" onclick="removeFile(${index})">✕</div>
        </div>
    `).join('');
}

function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderPreviews();
}

function toggleNewCat() {
    const container = document.getElementById('new-cat-container');
    container.classList.toggle('hidden');
}

function openModal(id = null) {
    isEditing = !!id;
    const modal = document.getElementById('product-modal');
    modal.classList.add('open');
    selectedFiles = [];
    document.getElementById('img-previews').innerHTML = '';
    document.getElementById('new-cat-container').classList.add('hidden');
    document.getElementById('p-new-cat').value = '';

    if (id) {
        const p = allProducts.find(x => x.id == id);
        document.getElementById('modal-title').textContent = 'Modify Asset';
        document.getElementById('p-id').value = p.id;
        document.getElementById('p-name').value = p.name;
        document.getElementById('p-cat-select').value = p.category_slug;
        document.getElementById('p-price').value = p.price;
        document.getElementById('p-old-price').value = p.old_price || '';
        document.getElementById('p-desc').value = p.description || '';
        
        // Show existing images as previews
        if (p.images && p.images.length) {
            selectedFiles = p.images.map(url => ({ file: null, preview: url, existing: true }));
            renderPreviews();
        } else if (p.image_url) {
            selectedFiles = [{ file: null, preview: p.image_url, existing: true }];
            renderPreviews();
        }
    } else {
        document.getElementById('modal-title').textContent = 'New Collection Item';
        document.getElementById('product-form').reset();
        document.getElementById('p-id').value = '';
    }
}

function closeModal() { document.getElementById('product-modal').classList.remove('open'); }

document.getElementById('product-form').onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('loader').style.display = 'flex';
    
    try {
        const sb = getSupabase();
        let cat_slug = document.getElementById('p-cat-select').value;
        const newCatName = document.getElementById('p-new-cat').value.trim();

        // 1. Handle New Category
        if (newCatName) {
            const slug = newCatName.toLowerCase().replace(/ /g, '-').replace(/[^\w-]/g, '');
            const { data: existCat } = await sb.from('categories').select('slug').eq('slug', slug).single();
            if (!existCat) {
                await sb.from('categories').insert({ name: newCatName, slug: slug });
                allCategories.push({ name: newCatName, slug: slug });
                updateCategoryDropdown();
            }
            cat_slug = slug;
        }

        // 2. Handle Image Uploads
        const uploadedUrls = [];
        for (const item of selectedFiles) {
            if (item.existing) {
                uploadedUrls.push(item.preview);
            } else {
                const ext = item.file.name.split('.').pop();
                const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${ext}`;
                const { data, error } = await sb.storage.from('products').upload(fileName, item.file);
                if (error) throw error;
                const { data: urlData } = sb.storage.from('products').getPublicUrl(fileName);
                uploadedUrls.push(urlData.publicUrl);
            }
        }

        // 3. Save Product
        const productData = {
            name: document.getElementById('p-name').value,
            category_slug: cat_slug,
            price: document.getElementById('p-price').value,
            old_price: document.getElementById('p-old-price').value || null,
            image_url: uploadedUrls[0] || '',
            images: uploadedUrls,
            description: document.getElementById('p-desc').value
        };

        const id = document.getElementById('p-id').value;
        let res;
        if (id) res = await sb.from('products').update(productData).eq('id', id);
        else res = await sb.from('products').insert(productData);

        if (res.error) throw res.error;

        closeModal();
        initPage();
    } catch (err) {
        console.error(err);
        alert('Asset Sync Error: ' + err.message);
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
};

async function deleteProduct(id) {
    if (confirm('ARCHIVE WARNING: Permanently purge this asset?')) {
        const { error } = await getSupabase().from('products').delete().eq('id', id);
        if (error) alert(error.message);
        else initPage();
    }
}

function editProduct(id) { openModal(id); }

initPage();
</script>
</body>
</html>
