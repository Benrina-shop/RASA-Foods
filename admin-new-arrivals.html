<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Arrivals | GOGO MART Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <link rel="stylesheet" href="responsive.css">
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--muted:#94a3b8}
    body{margin:0;background:var(--bg);color:#f8fafc;font-family:Inter,Arial,sans-serif}
    .sidebar{width:260px;height:100vh;position:fixed;inset:0 auto 0 0;padding:28px 20px;background:var(--surface);border-right:1px solid var(--border)}
    .main-content{margin-left:260px;padding:40px;min-height:100vh}
    .nav-link{display:block;padding:12px 16px;margin:4px 0;border-radius:12px;color:var(--muted);font-weight:700;text-decoration:none}
    .nav-link:hover,.nav-link.active{background:#2563eb22;color:#60a5fa}
    .arrival-row{display:grid;grid-template-columns:24px 64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
    .arrival-row img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#0f172a}
    input,button{font:inherit}
    @media(max-width:1024px){.sidebar{width:min(280px,85vw);z-index:2100;transform:translateX(-100%);transition:transform .2s}.admin-layout.admin-menu-open .sidebar{transform:translateX(0)}.main-content{margin:0;padding:78px 20px 32px}.admin-menu-toggle{display:block;position:fixed;top:12px;left:16px;z-index:2200;padding:10px 16px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:bold;min-height:44px}.admin-layout.admin-menu-open .admin-menu-shade{display:block;position:fixed;inset:0;background:#020617aa;z-index:2050}.arrival-row{grid-template-columns:24px 48px minmax(0,1fr) auto}.arrival-row img{width:48px;height:48px}}
  </style>
</head>
<body class="admin-layout">
  <aside class="sidebar">
    <h2 class="text-2xl font-black mb-8">GOGO <span class="text-slate-400 text-sm">ADMIN</span></h2>
    <nav>
      <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
      <a class="nav-link" href="admin-categories.html">Categories</a>
      <a class="nav-link active" href="admin-new-arrivals.html">New Arrivals</a>
      <a class="nav-link" href="admin-best-sellers.html">Best Sellers</a>
      <a class="nav-link" href="admin-products.html">Products</a>
      <a class="nav-link" href="admin-orders.html">Orders</a>
      <a class="nav-link" href="admin-offers.html">Offers</a>
      <a class="nav-link" href="admin-marquee.html">Live Marquee</a>
      <a class="nav-link" href="admin-banners.html">Cover Banners</a>
      <a class="nav-link" href="admin-ads.html">Promo Ads</a>
    </nav>
    <a class="nav-link mt-10" href="index.html">? Storefront</a>
  </aside>
  <main class="main-content">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div><h1 class="text-3xl sm:text-4xl font-black mb-2">New Arrivals</h1><p class="text-sm text-slate-400">Choose up to 8 products. Add, remove, then save to publish.</p></div>
      <button id="save-button" class="rounded-xl bg-blue-600 px-6 py-3 font-bold text-white hover:bg-blue-500">Save changes</button>
    </div>
    <p id="status" role="status" class="mb-4 text-sm text-slate-300"></p>
    <section class="rounded-2xl border border-slate-700 bg-slate-800 p-4 sm:p-6">
      <div class="flex flex-wrap gap-3 mb-5">
        <input id="product-search" type="search" placeholder="Find a product..." class="min-w-[220px] flex-1 rounded-xl border border-slate-600 bg-slate-900 px-4 py-3 text-white">
      </div>
      <div id="product-list" class="max-h-[65vh] overflow-y-auto"><p class="p-6 text-center text-slate-400">Loading products...</p></div>
    </section>
  </main>
  <script src="responsive.js"></script>
  <script>
    requireAdmin();
    const SETTING_SLUG='system_new_arrivals';
    let products=[];
    let selectedIds=[];
    let sb;
    const status=document.getElementById('status');
    function showStatus(text, error=false){status.textContent=text;status.className=`mb-4 text-sm ${error?'text-red-400':'text-emerald-400'}`;}
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function loadPage(){
      try{
        sb=getSupabase();
        const [{data:productRows,error:productError},{data:setting,error:settingError}]=await Promise.all([
          sb.from('products').select('id,name,category_slug,price,image_url,stock').order('created_at',{ascending:false}),
          sb.from('categories').select('id,image_url').eq('slug',SETTING_SLUG).maybeSingle()
        ]);
        if(productError)throw productError;
        if(settingError)throw settingError;
        products=productRows||[];
        try{selectedIds=setting?.image_url?JSON.parse(setting.image_url).map(String):[]}catch(_){selectedIds=[];}
        selectedIds=selectedIds.filter((id,index,list)=>list.indexOf(id)===index&&products.some(product=>String(product.id)===id)).slice(0,8);
        renderList();
      }catch(error){console.error(error);showStatus(error.message||'Could not load products.',true);}
    }
    function renderList(){
      const query=document.getElementById('product-search').value.trim().toLowerCase();
      const visible=products.filter(p=>!query||`${p.name} ${p.category_slug}`.toLowerCase().includes(query));
      const list=document.getElementById('product-list');
      if(!visible.length){list.innerHTML='<p class="p-6 text-center text-slate-400">No products found.</p>';return;}
      list.innerHTML=visible.map(p=>{
        const id=String(p.id),chosen=selectedIds.includes(id);
        return `<div class="arrival-row"><input type="checkbox" aria-label="Select ${esc(p.name)}" data-select-id="${esc(id)}" ${chosen?'checked':''} ${chosen||selectedIds.length<8?'':'disabled'} class="h-5 w-5 accent-blue-500"><img src="${esc(p.image_url||'logo.png')}" alt=""><div class="min-w-0"><p class="truncate font-bold">${esc(p.name)}</p><p class="text-xs text-slate-400">${esc(p.category_slug)} · Rs. ${Number(p.price||0).toLocaleString()}</p></div>${chosen?`<button data-remove-id="${esc(id)}" class="rounded-lg px-3 py-2 text-sm font-bold text-red-300 hover:bg-red-950">Remove</button>`:`<span class="text-xs text-slate-500">${Number(p.stock||0)<=0?'Out of stock':''}</span>`}</div>`;
      }).join('');
    }
    document.getElementById('product-list').addEventListener('change',event=>{
      const input=event.target.closest('[data-select-id]');if(!input)return;
      const id=input.dataset.selectId;
      if(input.checked){if(selectedIds.length>=8){input.checked=false;showStatus('Choose up to 8 products.',true);return;}selectedIds.push(id);}
      else selectedIds=selectedIds.filter(item=>item!==id);
      renderList();
    });
    document.getElementById('product-list').addEventListener('click',event=>{
      const button=event.target.closest('[data-remove-id]');if(!button)return;
      selectedIds=selectedIds.filter(id=>id!==button.dataset.removeId);renderList();
    });
    document.getElementById('product-search').addEventListener('input',renderList);
    document.getElementById('save-button').addEventListener('click',async event=>{
      const button=event.currentTarget;button.disabled=true;showStatus('Saving...');
      try{
        const {data:existing,error:readError}=await sb.from('categories').select('id').eq('slug',SETTING_SLUG).maybeSingle();
        if(readError)throw readError;
        const payload={name:'SYSTEM_NEW_ARRIVALS',slug:SETTING_SLUG,image_url:JSON.stringify(selectedIds.slice(0,8))};
        const result=existing
          ? await sb.from('categories').update(payload).eq('id',existing.id).select('id')
          : await sb.from('categories').insert(payload).select('id');
        if(result.error)throw result.error;
        if(!result.data?.length)throw new Error('No setting was saved. Check admin permissions and try again.');
        selectedIds=selectedIds.slice(0,8);renderList();showStatus('New Arrivals saved and published.');
        if(typeof notifyStoreUpdate==='function')notifyStoreUpdate('NEW_ARRIVALS_CHANGED');
      }catch(error){console.error(error);showStatus(error.message||'Could not save New Arrivals.',true);}
      finally{button.disabled=false;}
    });
    loadPage();
  </script>
</body>
</html>
