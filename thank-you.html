<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--border:#2e1800;--accent:#f97316;--cream:#fef3c7;--muted:#8a6840}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .success-icon{width:80px;height:80px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:50%;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 pt-24">
  <div class="max-w-md w-full text-center">
    <div class="success-icon mx-auto mb-6">
      <svg width="40" height="40" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 class="text-4xl font-bold mb-4" style="font-family:'Playfair Display',serif">Order Placed!</h1>
    <p class="text-[var(--muted)] mb-8">Thank you for your purchase. Your order has been successfully saved to our system.</p>
    
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-6 text-left mb-8">
      <h3 class="font-bold mb-4 border-b border-[var(--border)] pb-2">Order Summary</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between text-[var(--muted)]"><span>Order Total</span><span id="display-total" class="text-[var(--accent)] font-bold">...</span></div>
        <div class="flex justify-between text-[var(--muted)]"><span>Frequency</span><span>Standard Delivery</span></div>
      </div>
    </div>

    <div class="flex gap-4">
      <a href="index.html" class="flex-1 py-4 border border-[var(--border)] rounded-xl font-bold">Back to Home</a>
      <a href="products.html" class="flex-1 py-4 bg-orange-500 text-white font-bold rounded-xl">Keep Shopping</a>
    </div>
  </div>

<script src="supabase-config.js"></script>
<script>
const lastOrder = JSON.parse(localStorage.getItem('rasa-last-order') || '{}');
if (lastOrder.total) {
  document.getElementById('display-total').textContent = formatPrice(lastOrder.total);
}
</script>
</body>
</html>
