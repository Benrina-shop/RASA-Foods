<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    .input-field{width:100%;padding:.9rem;background:#ffffff;border:1px solid var(--border);border-radius:12px;outline:none;transition:border .2s;color:#0f172a}
    .input-field:focus{border-color:var(--accent)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md p-10 bg-[var(--surface)] border border-[var(--border)] rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
      <img src="logo.png" alt="GOGO MART Logo" class="w-16 h-16 object-contain rounded-full mx-auto mb-3 shadow-md border border-blue-200">
      <a href="index.html" class="font-display text-3xl font-black" style="font-family:'Plus Jakarta Sans', sans-serif"><span style="color:var(--accent)">GOGO</span> MART</a>
      <p class="text-[var(--muted)] text-sm mt-2 font-medium tracking-wide">Enter your credentials to continue</p>
    </div>
    
    <form id="sign-in-form" class="space-y-5">
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Email Address</label>
        <input type="email" id="email" required class="input-field" placeholder="your@email.com">
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Password</label>
        <input type="password" id="password" required class="input-field" placeholder="••••••••">
      </div>
      <button type="submit" id="signin-btn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-pink-500 rounded-xl font-bold text-white shadow-lg shadow-blue-500/20 hover:opacity-95 transition-all mt-4">Sign In</button>
      
      <div class="text-center space-y-4 pt-6">
        <p class="text-[var(--muted)] text-sm">Don't have an account? <a href="sign-up.html" class="text-[var(--accent)] font-bold">Sign Up</a></p>
        <div class="border-t border-[var(--border)] pt-4">
            <a href="admin-login.html" class="text-[10px] uppercase tracking-widest text-[var(--muted)] hover:text-white">Admin Staff? Login here</a>
        </div>
      </div>
    </form>
  </div>

<script src="supabase-config.js"></script>
<script>
  async function handleSignIn(e) {
    e.preventDefault();
    const btn = document.getElementById('signin-btn');
    btn.textContent = 'Authenticating...';
    btn.style.pointerEvents = 'none';
    
    if (typeof supabase === 'undefined' || !supabase) {
        if (window.supabase) supabase = window.supabase.createClient(SB_URL, SB_KEY);
        else { alert('System error. Refreshing...'); return location.reload(); }
    }

    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();

    try {
      // 1. Check Admin
      const { data: admin, error: e1 } = await supabase.from('admins').select('*').eq('email', email).eq('password_hash', pass);
      if (admin && admin.length > 0) {
        localStorage.setItem('isAdmin', 'true');
        localStorage.setItem('adminUser', JSON.stringify(admin[0]));
        return window.location.href = 'admin-dashboard.html';
      }

      // 2. Check Customer
      const { data: cust, error: e2 } = await supabase.from('customers').select('*').eq('email', email);
      if (cust && cust.length > 0) {
        localStorage.setItem('isCustomer', 'true');
        localStorage.setItem('customerUser', JSON.stringify(cust[0]));
        window.location.href = 'index.html';
      } else {
        alert('Credentials not found. Please sign up or check details.');
        btn.textContent = 'Sign In';
        btn.style.pointerEvents = 'auto';
      }
    } catch (err) {
      console.error(err);
      alert('Network error. Please try again.');
      btn.textContent = 'Sign In';
      btn.style.pointerEvents = 'auto';
    }
  }

  document.getElementById('sign-in-form').onsubmit = handleSignIn;
</script>
</body>
</html>
