<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GOGO MART</title>
  <meta http-equiv="refresh" content="4;url=index.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    .input-field{width:100%;padding:.9rem;background:#ffffff;border:1px solid var(--border);border-radius:12px;outline:none;transition:border .2s;color:#0f172a}
    .input-field:focus{border-color:var(--accent)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <script>location.replace('index.html?accounts=unavailable');</script>
  <div class="w-full max-w-md p-10 bg-[var(--surface)] border border-[var(--border)] rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
      <img src="logo.png" alt="GOGO MART Logo" class="w-16 h-16 object-contain rounded-full mx-auto mb-3 shadow-md border border-blue-200">
      <a href="index.html" class="font-display text-3xl font-black" style="font-family:'Plus Jakarta Sans', sans-serif"><span style="color:var(--accent)">GOGO</span> MART</a>
      <p class="text-[var(--muted)] text-sm mt-2 font-medium tracking-wide">Enter your credentials to continue</p>
    </div>
    
    <form id="sign-in-form" class="space-y-5">
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Mobile Number or Email</label>
        <input type="text" id="login-identifier" autocomplete="username" required class="input-field" placeholder="077 123 4567 or existing email">
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-widest text-[var(--muted)] mb-2 block">Password</label>
        <input type="password" id="password" required class="input-field" placeholder="••••••••">
      </div>
      <button type="submit" id="signin-btn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-pink-500 rounded-xl font-bold text-white shadow-lg shadow-blue-500/20 hover:opacity-95 transition-all mt-4">Sign In</button>
      
      <div class="text-center space-y-4 pt-6">
        <p class="text-[var(--muted)] text-sm">Don't have an account? <a href="sign-up.html" class="text-[var(--accent)] font-bold">Sign Up</a></p>
        <div class="border-t border-[var(--border)] pt-4">
            <a href="admin-login.html" class="text-[10px] uppercase tracking-widest text-[var(--muted)] hover:text-white">Admin Staff? Login here</a>
        </div>
      </div>
    </form>
  </div>

<script src="supabase-config.js"></script>
<script>
  document.getElementById('sign-in-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('signin-btn');
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = 'Signing in...';
    let status = document.getElementById('signin-message');
    if (!status) {
      status = document.createElement('p');
      status.id = 'signin-message';
      status.className = 'text-sm text-center text-red-600';
      status.setAttribute('role', 'status');
      event.currentTarget.insertBefore(status, button);
    }
    status.textContent = '';
    try {
      const sb = getSupabase();
      if (!sb) throw new Error('Account service is unavailable. Refresh and try again.');
      const { error } = await sb.auth.signInWithPassword({
        ...(document.getElementById('login-identifier').value.trim().includes('@')
          ? { email: document.getElementById('login-identifier').value.trim() }
          : { phone: normalizeLoginPhone(document.getElementById('login-identifier').value) }),
        password: document.getElementById('password').value
      });
      if (error) throw error;
      location.href = 'account.html';
    } catch (error) {
      status.textContent = error.message || 'Could not sign in. Check your email and password.';
      button.textContent = originalText;
      button.disabled = false;
    }
  });

  function normalizeLoginPhone(value) {
    const raw = value.trim().replace(/[\s()-]/g, '');
    if (raw.startsWith('+')) return raw;
    if (raw.startsWith('00')) return '+' + raw.slice(2);
    if (raw.startsWith('94') && raw.length === 11) return '+' + raw;
    if (raw.startsWith('0')) return '+94' + raw.slice(1);
    return '+94' + raw;
  }
</script>
</body>
</html>
