<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--cream:#fef3c7;--muted:#8a6840}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2rem 1.5rem}
    .main-content{margin-left:260px;padding:2rem 3rem}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-radius:12px;color:var(--muted);transition:all .2s;margin-bottom:.5rem}
    .nav-link:hover, .nav-link.active{background:rgba(249,115,22,.1);color:var(--accent)}
    .status-badge{padding:.25rem .75rem;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .status-pending{background:rgba(245,158,11,.15);color:#f59e0b}
    .status-completed{background:rgba(34,197,94,.15);color:#22c55e}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="sidebar">
    <div class="font-display text-2xl font-bold mb-10"><span style="color:var(--accent)">R</span>ASA Admin</div>
    <nav>
      <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
      <a href="admin-products.html" class="nav-link">Products</a>
      <a href="admin-orders.html" class="nav-link active">Orders</a>
      <a href="index.html" class="nav-link mt-10 text-sm">← Live Site</a>
    </nav>
  </div>

  <main class="main-content">
    <h1 class="text-3xl font-bold mb-8" style="font-family:'Playfair Display',serif">Customer Orders</h1>
    
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-[var(--bg)] text-xs uppercase tracking-widest text-[var(--muted)]">
          <tr>
            <th class="p-4">ID</th>
            <th class="p-4">Customer</th>
            <th class="p-4">Status</th>
            <th class="p-4 text-right">Total</th>
            <th class="p-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="orders-table"></tbody>
      </table>
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
checkAdmin();

async function loadOrders() {
  const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
  if (data) {
    document.getElementById('orders-table').innerHTML = data.map(o => `
      <tr class="border-t border-[var(--border)] hover:bg-[var(--surface2)]">
        <td class="p-4 text-xs font-mono text-[var(--muted)]">${o.id}</td>
        <td class="p-4">
          <p class="font-bold">${o.customer_name}</p>
          <p class="text-xs text-[var(--muted)]">${o.customer_phone}</p>
        </td>
        <td class="p-4">
          <span class="status-badge status-${o.status}">${o.status}</span>
        </td>
        <td class="p-4 text-right font-bold text-[var(--accent)]">${formatPrice(o.total_amount)}</td>
        <td class="p-4 text-right">
          <button onclick="updateStatus(${o.id}, '${o.status === 'pending' ? 'completed' : 'pending'}')" class="text-sm text-blue-400">
            Mark as ${o.status === 'pending' ? 'Completed' : 'Pending'}
          </button>
        </td>
      </tr>
    `).join('');
  }
}

async function updateStatus(id, status) {
  const { error } = await supabase.from('orders').update({ status }).eq('id', id);
  if (error) alert(error.message);
  else loadOrders();
}

loadOrders();
</script>
</body>
</html>
