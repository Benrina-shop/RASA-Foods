<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Transactions — RASA Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020100;--surface:#0a0501;--surface2:#110802;--border:#1f1105;--accent:#f97316;--cream:#fef3c7;--muted:#6b5a4d}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif}
    .sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2.5rem 1.5rem}
    .main-content{margin-left:280px;padding:3rem 4rem;min-height:100vh}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.85rem 1.25rem;border-radius:14px;color:var(--muted);transition:all .3s;margin-bottom:.5rem;font-weight:500;font-size:.9rem}
    .nav-link:hover, .nav-link.active{background:rgba(249,115,22,.08);color:var(--accent)}
    .status-badge{padding:.3rem .8rem;border-radius:50px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;border:1px solid currentColor}
    .st-pending{color:#f59e0b;background:rgba(245,158,11,.05)}
    .st-delivered{color:#22c55e;background:rgba(34,197,94,.05)}
    .st-cancelled{color:#ef4444;background:rgba(239,68,68,.05)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="sidebar flex flex-col justify-between">
    <div>
        <div class="font-display text-2xl font-black mb-12 flex items-center gap-2" style="font-family:'Playfair Display',serif">
            <span class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white text-lg">R</span>
            RASA <span class="text-xs font-normal opacity-40 tracking-widest uppercase">Admin</span>
        </div>
        <nav>
          <a href="admin-dashboard.html" class="nav-link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-width="2"/></svg>
              Dashboard
          </a>
          <a href="admin-products.html" class="nav-link">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2"/></svg>
              Products
          </a>
          <a href="admin-orders.html" class="nav-link active">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg>
              Orders
          </a>
        </nav>
    </div>
    <a href="index.html" class="nav-link">← Storefront</a>
  </div>

  <main class="main-content">
    <div class="flex justify-between items-end mb-12">
      <div>
          <h1 class="text-4xl font-black mb-2" style="font-family:'Playfair Display',serif">Orders</h1>
          <p class="text-sm text-[var(--muted)]">Monitor and fulfill customer purchase requests.</p>
      </div>
      <button onclick="initOrders()" class="px-6 py-3 bg-[var(--surface2)] border border-[var(--border)] text-white text-xs font-bold uppercase tracking-widest rounded-xl hover:border-orange-500 transition-all">Refresh Records</button>
    </div>
    
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-3xl overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-white/5 text-[10px] uppercase tracking-[.2em] text-[var(--muted)] font-bold">
          <tr>
            <th class="p-6">Transaction ID</th>
            <th class="p-6">Customer Details</th>
            <th class="p-6 text-center">Lifecycle</th>
            <th class="p-6 text-right">Settlement</th>
            <th class="p-6 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="orders-table" class="divide-y divide-[var(--border)]">
            <tr><td colspan="5" class="p-10 text-center text-[var(--muted)] animate-pulse">Syncing transactions...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
if (!localStorage.getItem('isAdmin')) location.href = 'admin-login.html';

async function initOrders() {
  try {
    if (typeof getSupabase !== 'function') return setTimeout(initOrders, 200);
    var sb = getSupabase();
    if (!sb) return setTimeout(initOrders, 200);

    const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });
    if (data) {
        renderTable(data);
    }
  } catch (err) { console.error(err); }
}

function renderTable(orders) {
    document.getElementById('orders-table').innerHTML = orders.map(o => `
      <tr class="hover:bg-white/5 transition-colors">
        <td class="p-6 font-mono text-[10px] text-[var(--muted)]">#${o.id.split('-')[0].toUpperCase()}</td>
        <td class="p-6">
            <p class="font-bold text-white text-sm">${o.customer_name}</p>
            <p class="text-[10px] text-[var(--muted)] font-medium">${o.customer_email || 'No email'} · ${o.customer_phone}</p>
        </td>
        <td class="p-6 text-center">
            <span class="status-badge st-${(o.status || 'Pending').toLowerCase()}">${o.status || 'Pending'}</span>
        </td>
        <td class="p-6 text-right font-black text-orange-500">${formatPrice(o.total_amount)}</td>
        <td class="p-6 text-right">
            <select onchange="updateStatus('${o.id}', this.value)" class="bg-[var(--bg)] border border-[var(--border)] text-[10px] p-2 rounded-lg font-bold outline-none">
                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
        </td>
      </tr>
    `).join('');
}

async function updateStatus(id, newStatus) {
  const { error } = await getSupabase().from('orders').update({ status: newStatus }).eq('id', id);
  if (error) alert(err.message);
  else initOrders();
}

initOrders();
</script>
</body>
</html>
