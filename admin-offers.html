<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing — GOGO MART Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#334155;--accent:#2563eb;--cream:#f8fafc;--muted:#94a3b8}
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif}
    .sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:fixed;padding:2.5rem 1.5rem}
    .main-content{margin-left:280px;padding:3rem 4rem;min-height:100vh}
    .nav-link{display:flex;align-items:center;gap:1rem;padding:.85rem 1.25rem;border-radius:14px;color:var(--muted);transition:all .3s;margin-bottom:.5rem;font-weight:500;font-size:.9rem}
    .nav-link:hover, .nav-link.active{background:rgba(37,99,235,0.15);color:var(--accent)}
    .input-field{width:100%;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:1px solid var(--border);color:var(--cream);outline:none;margin-bottom:1.25rem;font-size:.875rem}
    .input-field:focus{border-color:var(--accent)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:2rem}
    .modal.open{display:flex}
    .toggle-pill{width:40px;height:22px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;transition:all .3s}
    .toggle-pill.active{background:var(--accent)}
    .toggle-pill::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:white;border-radius:50%;transition:all .3s}
    .toggle-pill.active::after{left:21px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="admin-layout">
  <div id="offer-modal" class="modal">
    <div class="bg-[var(--surface)] p-10 rounded-3xl border border-[var(--border)] w-full max-w-md shadow-2xl">
      <h2 id="modal-title" class="text-3xl font-black mb-8 font-display" style="font-family:'Plus Jakarta Sans', sans-serif">New Promo Code</h2>
      <form id="offer-form">
        <input type="hidden" id="o-id">
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-blue-400 mb-2 block">Campaign Code</label>
            <input type="text" id="o-code" placeholder="WELCOME15" required class="input-field uppercase">
        </div>
        <div>
            <label class="text-[10px] font-bold uppercase tracking-widest text-blue-400 mb-2 block">Discount Percentage (%)</label>
            <input type="number" id="o-disc" placeholder="15" min="1" max="100" required class="input-field">
        </div>
        <div class="flex items-center justify-between mb-8 p-4 bg-white/5 rounded-2xl border border-[var(--border)]">
            <span class="text-xs font-bold uppercase tracking-widest text-[var(--muted)]">Active Status</span>
            <div id="o-active-toggle" class="toggle-pill active" onclick="this.classList.toggle('active')"></div>
        </div>
        <div class="flex gap-4">
          <button type="button" onclick="closeModal()" class="flex-1 py-4 bg-transparent border border-[var(--border)] rounded-xl font-bold uppercase text-xs tracking-widest">Cancel</button>
          <button type="submit" class="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 uppercase text-xs tracking-widest">Save Offer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="sidebar flex flex-col justify-between">
    <div>
        <div class="font-display text-2xl font-black mb-12 flex items-center gap-3" style="font-family:'Plus Jakarta Sans', sans-serif">
            <img src="logo.png" alt="GOGO MART" class="w-8 h-8 object-contain rounded-full border border-blue-400/40">
            <span>GOGO <span class="text-xs font-normal opacity-40 tracking-widest uppercase">Admin</span></span>
        </div>
        <nav>
        <a href="admin-dashboard.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-width="2"/></svg>
          Dashboard
        </a>
                <a href="admin-categories.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
          Categories
        </a>
        <a href="admin-new-arrivals.html" class="nav-link">New Arrivals</a>
        <a href="admin-best-sellers.html" class="nav-link">Best Sellers</a>
        <a href="admin-products.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-width="2"/></svg>
          Products
        </a>
        <a href="admin-orders.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke-width="2"/></svg>
          Orders
        </a>
        <a href="admin-offers.html" class="nav-link active">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" stroke-width="2"/></svg>
          Offers
        </a>
                        <a href="admin-marquee.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
          Live Marquee
        </a>
        <a href="admin-banners.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Cover Banners
        </a>
        <a href="admin-ads.html" class="nav-link ">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          Promo Ads
        </a>
      </nav>
    </div>
    <a href="index.html" class="nav-link">← Storefront</a>
  </div>

  <main class="main-content">
    <div class="flex justify-between items-end mb-12">
      <div>
          <h1 class="text-4xl font-black mb-2" style="font-family:'Plus Jakarta Sans', sans-serif">Marketing</h1>
          <p class="text-sm text-[var(--muted)]">Manage promo codes and customer incentives.</p>
      </div>
      <button onclick="openModal()" class="px-8 py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-500/25 hover:scale-105 transition-all">+ New Code</button>
    </div>
    
    <div id="offers-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Offers dynamic -->
    </div>
  </main>

<script src="supabase-config.js"></script>
<script>
requireAdmin();
let allOffers = [];

async function initOffers() {
    try {
        if (typeof getSupabase !== 'function') return setTimeout(initOffers, 200);
        const { data, error } = await getSupabase().from('promo_codes').select('*').order('created_at', { ascending: false });
        if (data) {
            allOffers = data;
            renderGrid();
        }
    } catch (e) { console.error(e); }
}

function renderGrid() {
    const grid = document.getElementById('offers-grid');
    if (allOffers.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-20 text-center text-[var(--muted)] bg-[var(--surface)] border border-[var(--border)] rounded-3xl">No active promo assets found.</div>';
        return;
    }
    grid.innerHTML = allOffers.map(o => `
        <div class="p-8 bg-[var(--surface)] border border-[var(--border)] rounded-[32px] hover:border-blue-400/40 transition-all group">
            <div class="flex justify-between items-start mb-6">
                <span class="px-3 py-1 bg-blue-500/15 text-blue-400 rounded-full text-[10px] font-black uppercase tracking-[.2em]">${o.is_active ? 'Active' : 'Paused'}</span>
                <div class="flex gap-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="editOffer(${o.id})" class="text-[var(--muted)] hover:text-white"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2"/></svg></button>
                    <button onclick="deleteOffer(${o.id})" class="text-[var(--muted)] hover:text-red-500"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"/></svg></button>
                </div>
            </div>
            <h3 class="text-3xl font-black text-white mb-2 font-mono tracking-tighter">${o.code}</h3>
            <p class="text-sm text-[var(--muted)] mb-8 font-medium">${o.discount_percentage}% Discount on total settlement</p>
            <div class="flex items-center gap-2">
                <div class="flex-1 h-1 bg-[var(--border)] rounded-full overflow-hidden">
                    <div class="h-full bg-blue-600" style="width: ${o.discount_percentage}%"></div>
                </div>
            </div>
        </div>
    `).join('');
}

function openModal(id = null) {
    const modal = document.getElementById('offer-modal');
    modal.classList.add('open');
    if (id) {
        const o = allOffers.find(x => x.id == id);
        document.getElementById('modal-title').textContent = 'Modify Offer';
        document.getElementById('o-id').value = o.id;
        document.getElementById('o-code').value = o.code;
        document.getElementById('o-disc').value = o.discount_percentage;
        if (o.is_active) document.getElementById('o-active-toggle').classList.add('active');
        else document.getElementById('o-active-toggle').classList.remove('active');
    } else {
        document.getElementById('modal-title').textContent = 'New Promo Code';
        document.getElementById('offer-form').reset();
        document.getElementById('o-id').value = '';
        document.getElementById('o-active-toggle').classList.add('active');
    }
}

function closeModal() { document.getElementById('offer-modal').classList.remove('open'); }

document.getElementById('offer-form').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('o-id').value;
    const data = {
        code: document.getElementById('o-code').value.toUpperCase(),
        discount_percentage: parseInt(document.getElementById('o-disc').value),
        is_active: document.getElementById('o-active-toggle').classList.contains('active')
    };

    const sb = getSupabase();
    let res;
    if (id) res = await sb.from('promo_codes').update(data).eq('id', id);
    else res = await sb.from('promo_codes').insert(data);

    if (res.error) alert(res.error.message);
    else {
        closeModal();
        initOffers();
    }
};

async function deleteOffer(id) {
    if (confirm('ARCHIVE WARNING: Purge this promo code from records?')) {
        const { error } = await getSupabase().from('promo_codes').delete().eq('id', id);
        if (error) alert(error.message);
        else initOffers();
    }
}

function editOffer(id) { openModal(id); }

initOffers();
</script>
  <script src="responsive.js"></script>
</body>
</html>
