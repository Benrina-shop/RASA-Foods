<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Catalogue — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--gold:#f59e0b;--cream:#fef3c7;--muted:#8a6840}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden;background-color:#080300}
    
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .4s ease;padding:1.2rem 1.5rem;background:rgba(8,3,0,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:500;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--cream)}

    .filter-drawer{position:fixed;top:0;right:-400px;width:400px;height:100vh;background:var(--surface);z-index:1000;padding:3rem;border-left:1px solid var(--border);transition:all .5s cubic-bezier(0.16, 1, 0.3, 1);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
    .filter-drawer.open{right:0}
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:999;display:none;opacity:0;transition:opacity .3s ease}
    .drawer-overlay.open{display:block;opacity:1}

    .prod-card{position:relative;overflow:hidden;border-radius:24px;background:var(--surface);border:1px solid var(--border);transition:all .4s ease;cursor:pointer}
    .prod-card:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 20px 60px rgba(249,115,22,.15)}
    .prod-card-img{width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .6s}
    .prod-card:hover .prod-card-img{transform:scale(1.05)}

    .search-bar{background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:.75rem 1.5rem;display:flex;items-center:center;gap:.75rem;width:100%;max-width:500px;transition:all .3s}
    .search-bar:focus-within{border-color:var(--accent);background:var(--surface2)}
    
    input[type="range"] { -webkit-appearance:none; width:100%; background:var(--border); height:4px; border-radius:5px; outline:none }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--accent); border-radius:50%; cursor:pointer }

    .badge-sale{position:absolute;top:14px;right:14px;background:var(--accent);color:white;font-size:10px;padding:3px 10px;border-radius:20px;font-weight:900;z-index:2;text-transform:uppercase;letter-spacing:1px}
    
    #toast{position:fixed;bottom:2rem;right:2rem;z-index:2000}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)"></div>
<div id="filter-drawer" class="filter-drawer flex flex-col justify-between">
    <div>
        <div class="flex items-center justify-between mb-12">
            <h2 class="text-3xl font-black font-display" style="font-family:'Playfair Display',serif">Refine Selection</h2>
            <button onclick="toggleDrawer(false)" class="p-2 hover:text-orange-500 transition-colors">✕</button>
        </div>

        <div class="space-y-10">
            <!-- Price Block -->
            <div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">Price Ceiling</span>
                    <span id="price-val" class="text-orange-500 font-black">Rs. 5,000</span>
                </div>
                <input type="range" id="price-range" min="0" max="10000" step="500" value="10000" oninput="updateFilters()">
                <div class="flex justify-between text-[8px] text-[var(--muted)] font-black uppercase mt-2">
                    <span>Rs. 0</span><span>Rs. 10,000+</span>
                </div>
            </div>

            <!-- Tags Block -->
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-4 block">Special Attributes</span>
                <div class="space-y-3">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="f-sale" onchange="updateFilters()" class="hidden peer">
                        <div class="w-5 h-5 border border-[var(--border)] rounded-md peer-checked:bg-orange-500 peer-checked:border-orange-500 transition-all flex items-center justify-center text-[10px] text-white">✓</div>
                        <span class="text-xs font-bold group-hover:text-white transition-colors">Ongoing Deals</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="f-new" onchange="updateFilters()" class="hidden peer">
                        <div class="w-5 h-5 border border-[var(--border)] rounded-md peer-checked:bg-orange-500 peer-checked:border-orange-500 transition-all flex items-center justify-center text-[10px] text-white">✓</div>
                        <span class="text-xs font-bold group-hover:text-white transition-colors">Newly Harvested</span>
                    </label>
                </div>
            </div>

            <!-- Sort Block -->
            <div>
                <span class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)] mb-4 block">Sequence</span>
                <select id="f-sort" onchange="updateFilters()" class="w-full bg-black/20 border border-[var(--border)] p-4 rounded-2xl text-xs font-bold uppercase tracking-widest outline-none focus:border-orange-500">
                    <option value="default">Default Arrangement</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="newest">Newest Arrivals First</option>
                </select>
            </div>
        </div>
    </div>

    <button onclick="resetFilters()" class="w-full py-4 border border-[var(--border)] rounded-2xl text-[10px] uppercase font-bold tracking-widest hover:bg-white/5 transition-all text-[var(--muted)]">Purge All Filters</button>
</div>

<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl font-bold" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Foods</span></a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link active">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </div>
    <div class="flex items-center gap-4">
      <a href="sign-in.html" class="flex items-center gap-2 px-4 py-2 rounded-full border border-[var(--border)] nav-link hover:border-orange-500/50 transition-all">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs font-bold uppercase tracking-wider hidden sm:inline">Sign In</span>
      </a>
      <a href="cart.html" class="relative p-2 nav-link">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cart-count" class="absolute -top-1 -right-1 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold bg-[var(--accent)]">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="pt-32 pb-24 px-6 min-h-screen">
  <div class="max-w-7xl mx-auto">
    <!-- Search & Control Bar -->
    <div class="flex flex-col md:flex-row gap-6 items-center justify-between mb-16">
        <div class="search-bar group">
            <svg width="18" height="18" fill="none" class="text-[var(--muted)] group-focus-within:text-orange-500" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2.5"/></svg>
            <input type="text" id="search-input" placeholder="Search by name, essence, or category..." class="bg-transparent border-none outline-none w-full text-sm font-medium placeholder:text-[var(--muted)]" oninput="updateFilters()">
        </div>
        <div class="flex items-center gap-3 overflow-x-auto no-scrollbar pb-2 md:pb-0" id="cat-filters">
            <!-- Categories dynamic -->
            <button onclick="filterCat('all')" class="px-6 py-2 rounded-full border border-[var(--border)] text-[10px] font-black uppercase tracking-widest hover:border-orange-500 transition-all whitespace-nowrap bg-orange-500 text-white" id="cat-all">All</button>
        </div>
        <button onclick="toggleDrawer(true)" class="flex items-center gap-3 px-8 py-3 bg-[var(--surface)] border border-[var(--border)] rounded-2xl hover:border-orange-500 transition-all font-bold text-xs">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" stroke-width="2"/></svg>
            Advanced Filters
            <span id="filter-count" class="hidden w-5 h-5 rounded-full bg-orange-500 text-[10px] text-white flex items-center justify-center">0</span>
        </button>
    </div>

    <!-- Active Filter Chips -->
    <div id="active-chips" class="flex flex-wrap gap-2 mb-8 hidden"></div>

    <!-- Products Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-8" id="products-grid">
        <div class="col-span-full py-24 text-center">
            <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-[10px] uppercase font-bold tracking-widest text-[var(--muted)]">Syncing inventory...</p>
        </div>
    </div>
  </div>
</div>

<footer class="py-16 px-6 border-t border-[var(--border)] bg-[var(--surface)] text-center">
  <div class="font-display text-3xl font-black text-[var(--accent)] mb-6" style="font-family:'Playfair Display',serif">RASA</div>
  <div class="flex justify-center gap-8 mb-8 text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">
      <a href="index.html" class="hover:text-white transition-colors">Home</a>
      <a href="offers.html" class="hover:text-white transition-colors">Offers</a>
      <a href="admin-login.html" class="hover:text-white transition-colors">Admin Portal</a>
  </div>
  <div class="text-[10px] text-[var(--muted)] uppercase tracking-widest opacity-40">© 2024 RASA Premium Foods. Handcrafted for excellence.</div>
</footer>

<div id="toast"></div>

<script src="supabase-config.js"></script>
<script>
let ALL_PRODUCTS = [];
let ALL_CATEGORIES = [];
let currentCat = 'all';
let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

async function initPage() {
    try {
        if (typeof getSupabase !== 'function') return setTimeout(initPage, 200);
        const sb = getSupabase();
        
        const { data: prods } = await sb.from('products').select('*');
        const { data: cats } = await sb.from('categories').select('*');
        
        ALL_PRODUCTS = prods || [];
        ALL_CATEGORIES = cats || [];
        
        renderCategories();
        updateFilters();
        updateCartCount();
    } catch (e) { console.error(e); }
}

function renderCategories() {
    const container = document.getElementById('cat-filters');
    const existingCount = 1; // 'All' exists
    container.innerHTML = `<button onclick="filterCat('all')" class="px-6 py-2 rounded-full border border-[var(--border)] text-[10px] font-black uppercase tracking-widest hover:border-orange-500 transition-all whitespace-nowrap ${currentCat === 'all' ? 'bg-orange-500 text-white border-orange-500' : ''}" id="cat-all">All</button>` + 
    ALL_CATEGORIES.map(c => `
        <button onclick="filterCat('${c.slug}')" class="px-6 py-2 rounded-full border border-[var(--border)] text-[10px] font-black uppercase tracking-widest hover:border-orange-500 transition-all whitespace-nowrap ${currentCat === c.slug ? 'bg-orange-500 text-white border-orange-500' : ''}">
            ${c.name}
        </button>
    `).join('');
}

function updateFilters() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const maxPrice = parseInt(document.getElementById('price-range').value);
    const onlySale = document.getElementById('f-sale').checked;
    const onlyNew = document.getElementById('f-new').checked;
    const sort = document.getElementById('f-sort').value;
    
    document.getElementById('price-val').textContent = `Rs. ${maxPrice.toLocaleString()}`;

    let filtered = ALL_PRODUCTS.filter(p => {
        const matchesCat = currentCat === 'all' || p.category_slug === currentCat;
        const matchesSearch = p.name.toLowerCase().includes(search) || p.category_slug.toLowerCase().includes(search);
        const matchesPrice = p.price <= maxPrice;
        const matchesSale = !onlySale || (p.old_price && p.old_price > p.price);
        const matchesNew = !onlyNew || p.is_new || (p.badge && p.badge.toLowerCase() === 'new');
        
        return matchesCat && matchesSearch && matchesPrice && matchesSale && matchesNew;
    });

    // Sorting
    if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
    else if (sort === 'newest') filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    renderGrid(filtered);
    updateFilterCount();
}

function renderGrid(data) {
    const grid = document.getElementById('products-grid');
    if (data.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-24 text-center text-[var(--muted)]">Precision matching found no results. Try broadening your criteria.</div>';
        return;
    }

    grid.innerHTML = data.map(p => {
        const hasSale = p.old_price && p.old_price > p.price;
        return `
            <div class="prod-card" onclick="location.href='product-detail.html?id=${p.id}'">
                ${hasSale ? `<div class="badge-sale">Deal</div>` : ''}
                <img src="${p.image_url}" class="prod-card-img" alt="${p.name}" loading="lazy">
                <div class="p-6">
                    <p class="text-[10px] uppercase text-[var(--accent)] font-bold mb-1 italic tracking-widest">${p.category_slug}</p>
                    <h3 class="font-bold text-sm mb-4 text-[var(--cream)] line-clamp-1">${p.name}</h3>
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col">
                            <span class="font-black text-[var(--accent)] text-lg">${formatPrice(p.price)}</span>
                            ${hasSale ? `<span class="text-[10px] line-through text-[var(--muted)]">${formatPrice(p.old_price)}</span>` : ''}
                        </div>
                        <button onclick="addToCart(${p.id},event)" class="w-10 h-10 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold shadow-lg shadow-orange-500/20 hover:scale-110 transition-all">+</button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function filterCat(cat) {
    currentCat = cat;
    renderCategories();
    updateFilters();
}

function toggleDrawer(open) {
    document.getElementById('filter-drawer').classList.toggle('open', open);
    document.getElementById('drawer-overlay').classList.toggle('open', open);
}

function updateFilterCount() {
    let count = 0;
    if (document.getElementById('price-range').value < 10000) count++;
    if (document.getElementById('f-sale').checked) count++;
    if (document.getElementById('f-new').checked) count++;
    if (document.getElementById('f-sort').value !== 'default') count++;
    
    const el = document.getElementById('filter-count');
    if (count > 0) {
        el.textContent = count;
        el.classList.remove('hidden');
    } else el.classList.add('hidden');
}

function resetFilters() {
    document.getElementById('price-range').value = 10000;
    document.getElementById('f-sale').checked = false;
    document.getElementById('f-new').checked = false;
    document.getElementById('f-sort').value = 'default';
    document.getElementById('search-input').value = '';
    currentCat = 'all';
    renderCategories();
    updateFilters();
}

function updateCartCount() { document.querySelectorAll('#cart-count').forEach(el => el.textContent = cart.reduce((s, i) => s + i.qty, 0)); }
function addToCart(id, e) {
    if (e) e.stopPropagation();
    const p = ALL_PRODUCTS.find(x => x.id == id);
    if(!p) return;
    const ex = cart.find(x => x.id == id);
    if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
    localStorage.setItem('rasa-cart', JSON.stringify(cart));
    updateCartCount();
    showToast('🛒 Added to basket');
}
function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'p-4 bg-orange-500 text-white rounded-2xl shadow-xl font-bold mb-2 flex items-center gap-3 animate-bounce shadow-orange-500/20';
    t.innerHTML = `<span>${msg}</span>`;
    document.getElementById('toast').appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

initPage();
</script>
</body>
</html>
