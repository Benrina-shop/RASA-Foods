<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Catalogue — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f0f7ff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'Plus Jakarta Sans', sans-serif;overflow-x:hidden}
    
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .3s ease;padding:1.1rem 1.5rem;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(15,23,42,0.03)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:600;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--accent)}

    /* Sidebar Layout */
    .catalog-container{display:grid;grid-template-columns:300px 1fr;gap:2.5rem;max-width:1400px;margin:0 auto;padding-top:115px;padding-bottom:100px}
    .filters-sidebar{position:sticky;top:115px;height:fit-content;background:#ffffff;border:1px solid var(--border);border-radius:24px;padding:2rem;box-shadow:0 4px 20px rgba(15,23,42,0.03)}
    
    .filter-section{margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
    .filter-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin-bottom:1rem}

    .checkbox-item{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
    .checkbox-item:hover{color:var(--cream)}
    .checkbox-item input{display:none}
    .check-box{width:18px;height:18px;border:1.5px solid #cbd5e1;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:#ffffff}
    .checkbox-item input:checked + .check-box{background:var(--accent);border-color:var(--accent)}
    .checkbox-item input:checked + .check-box svg{display:block}
    .checkbox-item svg{display:none;width:12px;height:12px;color:white}

    .search-input-box{background:#f8fafc;border:1.5px solid var(--border);border-radius:14px;padding:.8rem 1rem;width:100%;margin-bottom:1.5rem;color:var(--cream);outline:none;font-size:13px;transition:all .2s}
    .search-input-box:focus{border-color:var(--accent);background:#ffffff;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}

    input[type="range"] { -webkit-appearance:none; width:100%; background:#e2e8f0; height:4px; border-radius:5px; outline:none; margin:15px 0 }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--accent); border-radius:50%; cursor:pointer; border:2px solid #ffffff; box-shadow:0 2px 6px rgba(0,0,0,0.15) }

    /* Product Grid */
    .prod-card{background:#ffffff;border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:all .35s ease;cursor:pointer;box-shadow:0 4px 15px rgba(15,23,42,0.03)}
    .prod-card:hover{transform:translateY(-8px);border-color:#93c5fd;box-shadow:0 20px 35px -10px rgba(37,99,235,0.12)}
    .prod-card-img{width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .5s;background:#f1f5f9}
    .prod-card:hover .prod-card-img{transform:scale(1.05)}

    .badge-sale{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#ec4899,#f43f5e);color:white;font-size:9px;padding:3px 10px;border-radius:12px;font-weight:800;z-index:2;letter-spacing:0.5px;box-shadow:0 4px 10px rgba(236,72,153,0.3)}

    #mob-filter-btn{display:none}

    @media (max-width: 1024px) {
        .catalog-container{grid-template-columns:1fr;padding:120px 20px 60px}
        .filters-sidebar{display:none}
        .filters-sidebar.open{display:block;position:fixed;inset:0;background:#ffffff;z-index:200;padding:80px 30px;overflow-y:auto}
        #mob-filter-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:1rem;background:#ffffff;border:1px solid var(--border);border-radius:14px;margin-bottom:2rem;font-weight:bold;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.04);color:var(--cream)}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 font-display text-2xl font-bold" style="font-family:'Plus Jakarta Sans', sans-serif">
      <img src="logo.png" alt="GOGO MART Logo" class="w-10 h-10 object-contain rounded-full shadow-md border border-orange-500/30">
      <span><span style="color:var(--accent)">GOGO</span> <span class="text-sm font-semibold tracking-wider text-[var(--muted)]">MART</span></span>
    </a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link active">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </div>
      <!-- Global Live Search Bar with Instant Dropdown -->
      <div class="hidden sm:flex flex-1 max-w-md mx-6 relative" id="nav-search-container">
        <form action="products.html" method="GET" class="w-full relative" onsubmit="return handleNavSearch(event, this)">
          <div class="relative flex items-center w-full">
            <span class="absolute left-3.5 text-slate-400 pointer-events-none">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" name="q" id="nav-search-input" placeholder="Search Your Products" autocomplete="off" oninput="handleLiveSearch(this.value)" onfocus="handleLiveSearch(this.value)" class="nav-search-input w-full pl-10 pr-10 py-2 text-xs rounded-full bg-slate-100 hover:bg-slate-100/80 focus:bg-white border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none text-slate-800 transition-all">
            <button type="submit" class="absolute right-2 p-1 text-slate-400 hover:text-blue-600 transition-colors">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
          </div>
        </form>

        <!-- Live Instant Search Dropdown Results -->
        <div id="live-search-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-[1000] max-h-96 overflow-y-auto divide-y divide-slate-100">
          <div id="live-search-results" class="p-2 space-y-1"></div>
          <div id="live-search-footer" class="p-2.5 bg-slate-50 text-center border-t border-slate-100">
            <a href="products.html" id="view-all-search-link" class="text-[11px] font-bold text-blue-600 hover:text-blue-700 hover:underline">
              View all results
            </a>
          </div>
        </div>
      </div>
    <div class="flex items-center gap-4">
      <a href="sign-in.html" class="flex items-center gap-2 px-4 py-2 rounded-full border border-slate-200 bg-white hover:border-blue-500 hover:text-blue-600 transition-all shadow-sm text-slate-700">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs font-bold uppercase tracking-wider hidden sm:inline">Sign In</span>
      </a>
      <a href="cart.html" class="relative p-2.5 rounded-full bg-white border border-slate-200 text-slate-700 hover:text-blue-600 hover:border-blue-400 shadow-sm transition-all">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cart-count" class="absolute -top-1 -right-1 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold bg-pink-500 shadow-md">0</span>
      </a>
    </div>
  </div>
</nav>

<div class="max-w-7xl mx-auto px-6">
  <div class="catalog-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="filters-sidebar">
        <button class="md:hidden absolute top-4 right-4 text-2xl" onclick="toggleSidebar(false)">✕</button>
        
        <h2 class="text-2xl font-black mb-10 font-display" style="font-family:'Plus Jakarta Sans', sans-serif">Catalogue</h2>

        <div class="filter-section">
            <h3 class="filter-title">Search</h3>
            <input type="text" id="search-input" placeholder="Keyword or Essence..." class="search-input-box" oninput="updateFilters()">
        </div>

        <div class="filter-section">
            <h3 class="filter-title">Classification</h3>
            <div id="category-list">
                <label class="checkbox-item">
                    <input type="checkbox" value="all" checked onchange="filterCat('all')">
                    <div class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
                    <span>All Collections</span>
                </label>
            </div>
        </div>

        <div class="filter-section">
            <h3 class="filter-title">Price Ceiling</h3>
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold text-slate-500">MAX</span>
                <span id="price-display" class="text-sm font-black text-slate-900">Rs. 10,000</span>
            </div>
            <input type="range" id="price-range" min="0" max="10000" step="100" value="10000" oninput="updateFilters()">
        </div>

        <div class="filter-section">
            <h3 class="filter-title">Preferences</h3>
            <label class="checkbox-item">
                <input type="checkbox" id="f-sale" onchange="updateFilters()">
                <div class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
                <span>Ongoing Deals</span>
            </label>
            <label class="checkbox-item mt-2">
                <input type="checkbox" id="f-new" onchange="updateFilters()">
                <div class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
                <span>Newest Additions</span>
            </label>
        </div>

        <button onclick="resetFilters()" class="text-[10px] font-bold uppercase tracking-[.2em] text-[var(--muted)] hover:text-orange-500 transition-all">✕ Reset Selection</button>
    </aside>

    <!-- Content -->
    <main>
        <button id="mob-filter-btn" onclick="toggleSidebar(true)">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" stroke-width="2"/></svg>
            Refine Catalogue
        </button>

        <div class="flex justify-between items-center mb-8">
            <p id="result-count" class="text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">... Assets Found</p>
            <select id="f-sort" onchange="updateFilters()" class="bg-transparent border-none text-[10px] font-black uppercase tracking-widest text-orange-500 outline-none cursor-pointer">
                <option value="default">Default Sequence</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
            </select>
        </div>

        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center animate-pulse text-[var(--muted)]">Syncing inventory records...</div>
        </div>
    </main>
  </div>
</div>

<footer class="py-16 px-6 border-t border-[var(--border)] bg-[var(--surface)] text-center">
  <div class="flex items-center justify-center gap-3 mb-4">
    <img src="logo.png" alt="GOGO MART" class="w-12 h-12 object-contain rounded-full border border-orange-500/30">
    <span class="font-display text-3xl font-black text-[var(--accent)]" style="font-family:'Plus Jakarta Sans', sans-serif">GOGO MART</span>
  </div>
  <div class="flex justify-center gap-8 mb-8 text-[10px] font-bold uppercase tracking-widest text-[var(--muted)]">
      <a href="index.html" class="hover:text-white transition-colors">Home</a>
      <a href="offers.html" class="hover:text-white transition-colors">Offers</a>
  </div>
  <div class="text-[10px] text-[var(--muted)] uppercase tracking-widest opacity-40">© 2026 GOGO MART. Your Trusted Online Store.</div>
</footer>

<div id="toast" class="fixed bottom-6 right-6 z-[2000]"></div>

<script src="supabase-config.js"></script>
<script>
let ALL_PRODUCTS = [];
let ALL_CATEGORIES = [];
let selectedCats = ['all'];
let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');

async function initPage() {
    try {
        if (typeof getSupabase !== 'function') return setTimeout(initPage, 200);
        const sb = getSupabase();
        
        const { data: prods } = await sb.from('products').select('*');
        const { data: cats } = await sb.from('categories').select('*');
        
        ALL_PRODUCTS = prods || [];
        ALL_CATEGORIES = (cats || []).filter(c => c.slug !== 'system_cover_banner');
        
        // Read search query from URL parameter if present (e.g. products.html?q=chocolate)
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q');
        if (qParam) {
            const sInput = document.getElementById('search-input');
            if (sInput) sInput.value = qParam;
            const navInput = document.getElementById('nav-search-input');
            if (navInput) navInput.value = qParam;
        }

        renderCategories();
        updateFilters();
        updateCartCount();
    } catch (e) { console.error(e); }
}

function renderCategories() {
    const list = document.getElementById('category-list');
    list.innerHTML = `<label class="checkbox-item">
        <input type="checkbox" value="all" ${selectedCats.includes('all') ? 'checked' : ''} onchange="filterCat('all')">
        <div class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
        <span>All Collections</span>
    </label>` + 
    ALL_CATEGORIES.map(c => `
        <label class="checkbox-item">
            <input type="checkbox" value="${c.slug}" ${selectedCats.includes(c.slug) ? 'checked' : ''} onchange="filterCat('${c.slug}')">
            <div class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg></div>
            <span>${c.name}</span>
        </label>
    `).join('');
}

function filterCat(slug) {
    if (slug === 'all') {
        selectedCats = ['all'];
    } else {
        if (selectedCats.includes('all')) selectedCats = [];
        if (selectedCats.includes(slug)) {
            selectedCats = selectedCats.filter(s => s !== slug);
        } else {
            selectedCats.push(slug);
        }
    }
    if (selectedCats.length === 0) selectedCats = ['all'];
    renderCategories();
    updateFilters();
}

function updateFilters() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const maxPrice = parseInt(document.getElementById('price-range').value);
    const onlySale = document.getElementById('f-sale').checked;
    const onlyNew = document.getElementById('f-new').checked;
    const sort = document.getElementById('f-sort').value;
    
    document.getElementById('price-display').textContent = `Rs. ${maxPrice.toLocaleString()}`;

    let filtered = ALL_PRODUCTS.filter(p => {
        const matchesCat = selectedCats.includes('all') || selectedCats.includes(p.category_slug);
        const matchesSearch = p.name.toLowerCase().includes(search) || p.category_slug.toLowerCase().includes(search);
        const matchesPrice = Number(p.price) <= maxPrice;
        const matchesSale = !onlySale || (p.old_price && Number(p.old_price) > Number(p.price));
        const matchesNew = !onlyNew || p.is_new || (p.badge && p.badge.toLowerCase().includes('new'));
        
        return matchesCat && matchesSearch && matchesPrice && matchesSale && matchesNew;
    });

    if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
    else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

    document.getElementById('result-count').textContent = `${filtered.length} Assets Found`;
    renderGrid(filtered);
}


let hoverTimers = {};
function startHoverCarousel(id) {
    const p = ALL_PRODUCTS.find(x => x.id == id);
    if (!p) return;
    let imgs = [];
    if (Array.isArray(p.images) && p.images.length > 0) {
        imgs = p.images.filter(x => x && typeof x === 'string' && x.trim().length > 0);
    }
    if (imgs.length <= 1) return;
    let currentIdx = 0;
    const imgEl = document.getElementById('card-img-' + id);
    if (!imgEl) return;
    if (hoverTimers[id]) clearInterval(hoverTimers[id]);
    hoverTimers[id] = setInterval(() => {
        currentIdx = (currentIdx + 1) % imgs.length;
        imgEl.style.opacity = '0.5';
        setTimeout(() => {
            imgEl.src = imgs[currentIdx];
            imgEl.style.opacity = '1';
        }, 120);
    }, 850);
}

function stopHoverCarousel(id) {
    if (hoverTimers[id]) {
        clearInterval(hoverTimers[id]);
        delete hoverTimers[id];
    }
    const p = ALL_PRODUCTS.find(x => x.id == id);
    if (!p) return;
    const imgEl = document.getElementById('card-img-' + id);
    if (imgEl) {
        let firstImg = (Array.isArray(p.images) && p.images.length > 0) ? p.images[0] : (p.image_url || 'logo.png');
        imgEl.src = firstImg;
        imgEl.style.opacity = '1';
    }
}

function renderGrid(data) {
    const grid = document.getElementById('products-grid');
    if (data.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-20 text-center text-[var(--muted)]">No matches found for your criteria.</div>';
        return;
    }
    grid.innerHTML = data.map(p => `
        <div class="prod-card relative" onmouseenter="startHoverCarousel(${p.id})" onmouseleave="stopHoverCarousel(${p.id})" onclick="location.href='product-detail.html?id=${p.id}'">
            ${(p.stock !== undefined && p.stock !== null && Number(p.stock) <= 0) 
              ? `<div class="badge-sale bg-red-600 text-white font-bold">OUT OF STOCK</div>` 
              : (p.old_price && Number(p.old_price) > Number(p.price)) ? `<div class="badge-sale">OFFER</div>` : ''}
            <img id="card-img-${p.id}" src="${p.image_url}" class="prod-card-img transition-opacity duration-300" alt="${p.name}">
            <div class="p-5">
                <p class="text-[10px] uppercase font-bold text-blue-600 mb-1 tracking-wider">${p.category_slug}</p>
                <h3 class="font-bold text-sm mb-3 text-slate-900 line-clamp-1">${p.name}</h3>
                <div class="flex items-baseline justify-between mb-3">
                    <div class="flex items-baseline gap-2">
                        <span class="font-black text-blue-600 text-base">${formatPrice(p.price)}</span>
                        ${p.old_price && Number(p.old_price) > Number(p.price) ? `<span class="text-[10px] line-through text-slate-400">${formatPrice(p.old_price)}</span>` : ''}
                    </div>
                </div>
                ${(p.stock !== undefined && p.stock !== null && Number(p.stock) <= 0) ? `
                <div class="mt-2 py-2 px-3 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs text-center border border-slate-200">
                    Out of Stock
                </div>
                ` : `
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button onclick="addToCart(${p.id},event)" class="py-2 px-2 rounded-xl border border-blue-600 text-blue-600 hover:bg-blue-50 font-bold text-xs flex items-center justify-center gap-1 transition-all">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                        Add To Cart
                    </button>
                    <button onclick="buyNow(${p.id},event)" class="py-2 px-2 rounded-xl bg-gradient-to-r from-blue-600 to-pink-500 hover:from-blue-700 hover:to-pink-600 text-white font-bold text-xs shadow-md shadow-blue-500/20 hover:shadow-lg transition-all flex items-center justify-center gap-1">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        Buy Now
                    </button>
                </div>
                `}
            </div>
        </div>
    `).join('');
}

function resetFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('price-range').value = 10000;
    document.getElementById('f-sale').checked = false;
    document.getElementById('f-new').checked = false;
    selectedCats = ['all'];
    renderCategories();
    updateFilters();
}

function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
}

function updateCartCount() { document.querySelectorAll('#cart-count').forEach(el => el.textContent = cart.reduce((s, i) => s + i.qty, 0)); }
function buyNow(id, e) {
    if (e) e.stopPropagation();
    const p = ALL_PRODUCTS.find(x => x.id == id);
    if (!p) return;
    const ex = cart.find(x => x.id == id);
    if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
    localStorage.setItem('rasa-cart', JSON.stringify(cart));
    updateCartCount();
    window.location.href = 'checkout.html';
}
function addToCart(id, e) {
    if (e) e.stopPropagation();
    const p = ALL_PRODUCTS.find(x => x.id == id);
    if(!p) return;
    const ex = cart.find(x => x.id == id);
    if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
    localStorage.setItem('rasa-cart', JSON.stringify(cart));
    updateCartCount();
    showToast('🛒 Added to basket');
}
function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'p-4 bg-orange-600 text-white rounded-xl shadow-2xl font-bold mb-2';
    t.textContent = msg; document.getElementById('toast').appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
