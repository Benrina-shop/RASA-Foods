<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — RASA Foods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080300;--surface:#110700;--surface2:#1c0d00;--border:#2e1800;--accent:#f97316;--gold:#f59e0b;--cream:#fef3c7;--muted:#8a6840}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:'DM Sans',sans-serif;overflow-x:hidden}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .4s ease;padding:1.2rem 1.5rem;background:rgba(8,3,0,.96);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .nav-link{color:var(--muted);font-size:.875rem;font-weight:500;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--cream)}
    .prod-card{position:relative;overflow:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--border);transition:all .4s cubic-bezier(.175,.885,.32,1.275);cursor:pointer}
    .prod-card:hover{transform:translateY(-8px);border-color:var(--accent);box-shadow:0 20px 60px rgba(249,115,22,.18)}
    .prod-card-img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s}
    .badge{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;z-index:2;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff}
    .badge-new{background:linear-gradient(135deg,#22c55e,#16a34a)}
    .badge-pop{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .filter-btn{padding:.5rem 1.2rem;border-radius:50px;font-size:.8rem;font-weight:600;transition:all .2s;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
    .filter-btn.active,.filter-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
    .search-input{background:var(--surface);border:1px solid var(--border);color:var(--cream);border-radius:50px;padding:.8rem 1.2rem .8rem 3rem;width:100%;outline:none;font-size:.9rem}
    .divider{width:52px;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;margin:.8rem 0 2rem}
    #mob-menu{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
    #mob-menu.open{display:flex}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav id="navbar">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="font-display text-2xl font-bold" style="font-family:'Playfair Display',serif"><span style="color:var(--accent)">R</span>ASA <span class="text-sm font-normal text-[var(--muted)]">Foods</span></a>
    <div class="hidden md:flex items-center gap-8">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link active">Products</a>
      <a href="offers.html" class="nav-link">Offers</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </div>
    <div class="flex items-center gap-3">
      <a href="cart.html" class="relative p-2 nav-link">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span id="cart-count" class="absolute -top-1 -right-1 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold bg-[var(--accent)]">0</span>
      </a>
      <button id="menu-toggle" class="md:hidden p-2 nav-link"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </div>
</nav>

<div id="mob-menu">
  <button id="mob-close" class="absolute top-6 right-6 p-2 text-[var(--muted)]"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
  <a href="index.html" class="text-2xl">Home</a>
  <a href="products.html" class="text-2xl active">Products</a>
</div>

<div class="pt-32 pb-12 px-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="font-display text-4xl font-bold mb-4" style="font-family:'Playfair Display',serif">Our Collection</h1>
    <div class="flex flex-wrap gap-4 mb-8" id="cat-filters">
        <button onclick="filterCat('all')" class="filter-btn active" data-cat="all">All Products</button>
        <button onclick="filterCat('snacks')" class="filter-btn" data-cat="snacks">Snacks</button>
        <button onclick="filterCat('sweets')" class="filter-btn" data-cat="sweets">Sweets</button>
        <button onclick="filterCat('beverages')" class="filter-btn" data-cat="beverages">Beverages</button>
        <button onclick="filterCat('spices')" class="filter-btn" data-cat="spices">Spices</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="products-grid"></div>
  </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 z-50"></div>

<script src="supabase-config.js"></script>
<script>
let ALL_PRODUCTS = [];
let currentCat = 'all';

async function loadProducts() {
  const { data, error } = await supabase.from('products').select('*');
  if (error) return console.error(error);
  ALL_PRODUCTS = data;
  
  const urlCat = new URLSearchParams(location.search).get('cat');
  if(urlCat) filterCat(urlCat); else render();
}

function render() {
  const filtered = currentCat === 'all' ? ALL_PRODUCTS : ALL_PRODUCTS.filter(p => p.category_slug === currentCat);
  const grid = document.getElementById('products-grid');
  grid.innerHTML = filtered.map(p => `
    <div class="prod-card" onclick="location.href='product-detail.html?id=${p.id}'">
      ${p.badge ? `<div class="badge ${p.badge_type === 'new' ? 'badge-new' : p.badge_type === 'pop' ? 'badge-pop' : ''}">${p.badge}</div>` : ''}
      <img src="${p.image_url}" class="prod-card-img" alt="${p.name}">
      <div class="p-4">
        <p class="text-xs uppercase text-[var(--accent)]">${p.category_slug}</p>
        <h3 class="font-semibold text-sm mb-2">${p.name}</h3>
        <div class="flex items-center justify-between">
          <span class="font-bold text-sm text-[var(--accent)]">${formatPrice(p.price)}</span>
          <button onclick="addToCart(${p.id},event)" class="w-8 h-8 rounded-full bg-orange-500 text-white">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  render();
}

let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
function updateCartCount() { document.querySelectorAll('#cart-count').forEach(el => el.textContent = cart.reduce((s, i) => s + i.qty, 0)); }
function addToCart(id, e) {
  if (e) e.stopPropagation();
  const p = ALL_PRODUCTS.find(x => x.id == id);
  const ex = cart.find(x => x.id == id);
  if (ex) ex.qty++; else cart.push({ ...p, qty: 1 });
  localStorage.setItem('rasa-cart', JSON.stringify(cart));
  updateCartCount();
  showToast('🛒 Added to cart');
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'p-3 bg-orange-500 text-white rounded-lg shadow-lg mb-2';
  t.textContent = msg; document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

document.getElementById('menu-toggle').onclick = () => document.getElementById('mob-menu').classList.add('open');
document.getElementById('mob-close').onclick = () => document.getElementById('mob-menu').classList.remove('open');

updateCartCount();
loadProducts();
</script>
</body>
</html>
