<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Checkout — GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f0f7ff;
      --border: #e2e8f0;
      --accent: #2563eb;
      --pink: #ec4899;
      --yellow: #f59e0b;
      --gold: #f59e0b;
      --cream: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden
    }

    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.1rem 1.5rem;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03)
    }

    .input-field {
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
      outline: none;
      transition: all .2s ease;
      font-size: .9rem
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1)
    }

    #summary-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 2rem;
      position: sticky;
      top: 120px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04)
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="loader" class="loading-overlay">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
      <div class="text-xl font-black font-display" style="font-family:'Plus Jakarta Sans', sans-serif">Securing Order
        Portal...</div>
      <p class="text-xs text-[var(--muted)] mt-2 uppercase tracking-widest font-bold">Please do not refresh</p>
    </div>
  </div>

  <nav id="navbar">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 font-display text-2xl font-bold"
        style="font-family:'Plus Jakarta Sans', sans-serif">
        <img src="logo.png" alt="GOGO MART Logo"
          class="w-10 h-10 object-contain rounded-full shadow-md border border-blue-500/30">
        <span><span style="color:var(--accent)">GOGO</span> <span
            class="text-sm font-semibold tracking-wider text-[var(--muted)]">MART</span></span>
      </a>
      <a href="cart.html"
        class="text-xs font-bold uppercase tracking-widest text-[var(--muted)] hover:text-white transition-colors">←
        Return to Basket</a>
    </div>
  </nav>

  <main class="pt-32 pb-24 px-6 min-h-screen">
    <div class="max-w-7xl mx-auto grid lg:grid-cols-3 gap-12">
      <div class="lg:col-span-2 space-y-10">
        <h1 class="font-display text-4xl font-black mb-10" style="font-family:'Plus Jakarta Sans', sans-serif">Checkout
        </h1>

        <section class="space-y-6">
          <div class="flex items-center gap-4 mb-4">
            <div class="step-badge">1</div>
            <h2 class="text-xl font-bold">Personal Details</h2>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">First Name</label>
              <input type="text" id="fname" placeholder="John" required class="input-field">
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">Last Name</label>
              <input type="text" id="lname" placeholder="Doe" required class="input-field">
            </div>
            <div class="md:col-span-2">
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">Email
                Communication</label>
              <input type="email" id="email" placeholder="john@example.com" required class="input-field">
            </div>
            <div class="md:col-span-1">
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">Mobile
                Identification</label>
              <input type="tel" id="phone" placeholder="+94 7X XXX XXXX" required class="input-field">
            </div>
            <div class="md:col-span-1">
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">WhatsApp Number
                (Optional)</label>
              <input type="tel" id="whatsapp" placeholder="+94 7X XXX XXXX" class="input-field">
            </div>
          </div>
        </section>

        <section class="space-y-6">
          <div class="flex items-center gap-4 mb-4">
            <div class="step-badge">2</div>
            <h2 class="text-xl font-bold">Address</h2>
          </div>
          <div class="grid gap-4">
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">Street
                Address</label>
              <input type="text" id="address" placeholder="123 Signature Way" required class="input-field">
            </div>
            <div>
              <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block">City /
                Province</label>
              <input type="text" id="city" placeholder="e.g. Colombo, Kandy, Galle" required class="input-field">
            </div>
            <div class="pt-2">
              <label
                class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-2 block flex items-center justify-between">
                <span>Special Note (Optional)</span>
                <span class="text-[9px] text-slate-400 font-normal lowercase tracking-normal">e.g. delivery time,
                  landmarks, special requests</span>
              </label>
              <textarea id="special-note" rows="3"
                placeholder="Add any special instructions or delivery preferences here..."
                class="input-field resize-none"></textarea>
            </div>
          </div>
        </section>
      </div>

      <div>
        <div id="summary-card">
          <div
            class="mb-8 p-6 bg-gradient-to-r from-blue-600 to-pink-500/5 rounded-2xl border border-dashed border-blue-500/20">
            <label class="text-[10px] font-bold uppercase tracking-widest text-blue-600 mb-3 block">Have an Offer
              Code?</label>
            <div class="flex gap-2">
              <input type="text" id="coupon-input" placeholder="e.g. GOGO40"
                class="input-field mb-0 uppercase text-xs tracking-widest">
              <button onclick="applyCoupon()"
                class="px-4 py-2 bg-gradient-to-r from-blue-600 to-pink-500 text-white rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-orange-600 transition-all">Apply</button>
            </div>
            <p id="coupon-msg" class="text-[9px] mt-2 font-bold uppercase tracking-widest"></p>
          </div>

          <h2 class="font-display text-2xl font-bold mb-8" style="font-family:'Plus Jakarta Sans', sans-serif">Your
            Order</h2>
          <div id="order-items" class="space-y-4 mb-8"></div>

          <div class="space-y-4 pt-6 border-t border-slate-200">
            <div class="flex justify-between text-sm text-slate-600"><span>Subtotal</span><span id="subtotal"
                class="font-bold text-slate-900">Rs. 0</span></div>
            <div id="discount-row" class="flex justify-between text-sm text-green-600 hidden"><span>Incentive
                Discount</span><span id="discount-val">Rs. 0</span></div>
            <div class="flex justify-between text-sm text-slate-600"><span>Delivery</span><span
                class="font-bold text-slate-900">Rs. 399</span></div>
            <div
              class="flex justify-between font-black text-xl text-blue-600 pt-4 border-t border-slate-200">
              <span class="text-slate-900">Total Settlement</span><span id="total">Rs. 0</span>
            </div>
          </div>
          <button onclick="placeOrder()"
            class="w-full mt-10 py-5 bg-gradient-to-r from-blue-600 to-pink-500 text-white font-black rounded-2xl hover:bg-orange-600 transition-all shadow-xl shadow-blue-500/10 uppercase tracking-widest">Place
            Order (COD)</button>
          <div class="flex items-center justify-center gap-2 mt-6">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
            <span class="text-[10px] uppercase font-bold text-[var(--muted)] tracking-widest">Payment on Delivery
              Secured</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="supabase-config.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('rasa-cart') || '[]');
    if (cart.length === 0) location.href = 'products.html';

    let subtotal = 0;
    let discountPercent = 0;

    function renderSummary() {
      const container = document.getElementById('order-items');
      subtotal = 0;

      if (!cart || cart.length === 0) {
        container.innerHTML = '<div class="p-6 text-center text-slate-400 font-medium bg-slate-50 rounded-2xl border border-slate-100">Your basket is empty. <a href="products.html" class="text-blue-600 font-bold ml-1">Shop items</a></div>';
        updateTotals();
        return;
      }

      container.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;
        return `
      <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-100 transition-all hover:shadow-sm">
        <img src="${item.image_url || 'logo.png'}" alt="${item.name}" class="w-14 h-14 rounded-xl object-cover border border-slate-200 shrink-0">
        <div class="flex-1 min-w-0">
          <h4 class="font-bold text-sm text-slate-900 truncate">${item.name}</h4>
          <p class="text-xs text-slate-500 mt-0.5">${formatPrice(item.price)} each</p>
          <div class="flex items-center gap-2 mt-2">
            <div class="flex items-center bg-white border border-slate-200 rounded-lg shadow-xs">
              <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-l-lg font-bold text-xs transition-colors">−</button>
              <span class="w-7 text-center font-black text-xs text-slate-900">${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-50 rounded-r-lg font-bold text-xs transition-colors">+</button>
            </div>
            <button onclick="removeItem(${item.id})" class="text-[11px] text-red-400 hover:text-red-600 font-medium transition-colors ml-1">Remove</button>
          </div>
        </div>
        <div class="text-right shrink-0 self-center">
          <span class="font-black text-slate-900 text-sm block">${formatPrice(itemTotal)}</span>
        </div>
      </div>
    `;
      }).join('');

      updateTotals();
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id == id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(x => x.id != id);
      }
      localStorage.setItem('rasa-cart', JSON.stringify(cart));
      renderSummary();
      if (cart.length === 0) {
        setTimeout(() => { location.href = 'products.html'; }, 800);
      }
    }

    function removeItem(id) {
      cart = cart.filter(x => x.id != id);
      localStorage.setItem('rasa-cart', JSON.stringify(cart));
      renderSummary();
      if (cart.length === 0) {
        setTimeout(() => { location.href = 'products.html'; }, 800);
      }
    }

    function updateTotals() {
      const discountAmount = (subtotal * discountPercent) / 100;
      const total = (subtotal - discountAmount) + 399;

      document.getElementById('subtotal').textContent = formatPrice(subtotal);
      if (discountPercent > 0) {
        document.getElementById('discount-row').classList.remove('hidden');
        document.getElementById('discount-val').textContent = `- ${formatPrice(discountAmount)}`;
      } else {
        document.getElementById('discount-row').classList.add('hidden');
      }
      document.getElementById('total').textContent = formatPrice(total);
    }

    async function applyCoupon() {
      const code = document.getElementById('coupon-input').value.trim().toUpperCase();
      const msg = document.getElementById('coupon-msg');

      if (!code) return;

      try {
        const sb = getSupabase();
        const { data, error } = await sb.from('promo_codes').select('*').eq('code', code).eq('is_active', true).single();

        if (error || !data) {
          msg.textContent = 'Invalid or expired code';
          msg.className = 'text-[9px] mt-2 font-bold uppercase tracking-widest text-red-500';
          discountPercent = 0;
        } else {
          msg.textContent = `Applied: ${data.discount_percentage}% discount`;
          msg.className = 'text-[9px] mt-2 font-bold uppercase tracking-widest text-green-500';
          discountPercent = data.discount_percentage;
        }
        updateTotals();
      } catch (e) { console.error(e); }
    }

    async function placeOrder() {
      const fname = document.getElementById('fname').value.trim();
      const lname = document.getElementById('lname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const whatsapp = document.getElementById('whatsapp').value.trim();
      const address = document.getElementById('address').value.trim();
      const city = document.getElementById('city').value.trim();
      const note = document.getElementById('special-note') ? document.getElementById('special-note').value.trim() : '';

      if (!fname || !phone || !address) return alert('Please complete the required identification fields.');

      document.getElementById('loader').style.display = 'flex';

      try {
        const sb = getSupabase();
        const discountAmount = (subtotal * discountPercent) / 100;
        const finalTotal = (subtotal - discountAmount) + 399;

        const formattedAddress = note
          ? `${address}, ${city} [Special Note: ${note}]`
          : `${address}, ${city}`;

        const orderPayload = {
          customer_name: fname + ' ' + lname,
          customer_email: email,
          customer_phone: phone,
          whatsapp_number: whatsapp,
          shipping_address: formattedAddress,
          note: note || null,
          total_amount: finalTotal,
          status: 'Pending'
        };

        let { data: order, error: orderErr } = await sb.from('orders').insert(orderPayload).select().single();

        // Fallback if 'note' column doesn't exist yet in database
        if (orderErr && orderErr.message && orderErr.message.includes('note')) {
          delete orderPayload.note;
          const retry = await sb.from('orders').insert(orderPayload).select().single();
          order = retry.data;
          orderErr = retry.error;
        }

        if (orderErr) throw orderErr;

        const items = cart.map(i => ({
          order_id: order.id,
          product_id: i.id,
          quantity: i.qty,
          unit_price: i.price
        }));

        const { error: itemsErr } = await sb.from('order_items').insert(items);
        if (itemsErr) throw itemsErr;

        // Automatically deduct stock for purchased items
        for (const item of cart) {
          try {
            const { data: currentP } = await sb.from('products').select('stock').eq('id', item.id).single();
            if (currentP && currentP.stock !== undefined && currentP.stock !== null) {
              const newStock = Math.max(0, currentP.stock - item.qty);
              await sb.from('products').update({ stock: newStock }).eq('id', item.id);
            }
          } catch (stkErr) {
            console.warn('Stock update skipped for item ' + item.id, stkErr);
          }
        }

        localStorage.removeItem('rasa-cart');
        localStorage.setItem('rasa-last-order', JSON.stringify({ id: order.id, total: finalTotal }));
        location.href = 'thank-you.html';

      } catch (err) {
        console.error(err);
        alert('Synchronization failure. Please verify connection and try again.');
        document.getElementById('loader').style.display = 'none';
      }
    }

    renderSummary();
  </script>
<script src="live-marquee.js"></script>
<script src="whatsapp-widget.js"></script>
</body>

</html>
