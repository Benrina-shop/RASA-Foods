<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>My Account | GOGO MART</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="responsive.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-4 sm:p-6">
  <main class="w-full max-w-lg rounded-3xl border border-slate-200 bg-white p-6 sm:p-9 shadow-xl">
    <header class="text-center mb-7">
      <img src="logo.png" alt="GOGO MART" class="w-16 h-16 object-contain mx-auto mb-3">
      <h1 class="text-2xl sm:text-3xl font-black"><span class="text-blue-600">GOGO</span> MART</h1>
      <p class="text-slate-500 mt-2">Your account details and saved shopping data</p>
    </header>

    <form id="profile-form" class="space-y-4">
      <label class="block text-sm font-semibold" for="profile-name">Name
        <input id="profile-name" type="text" autocomplete="name" maxlength="120" required class="mt-2 w-full rounded-xl border border-slate-200 p-3 font-normal outline-none focus:border-blue-500">
      </label>
      <label class="block text-sm font-semibold" for="profile-address">Address
        <textarea id="profile-address" autocomplete="street-address" maxlength="500" rows="3" placeholder="House number, street, town/city" required class="mt-2 w-full rounded-xl border border-slate-200 p-3 font-normal outline-none focus:border-blue-500"></textarea>
      </label>
      <label class="block text-sm font-semibold" for="profile-email">Email (if already linked)
        <input id="profile-email" type="email" readonly class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 p-3 font-normal text-slate-500">
      </label>
      <button id="save-profile-button" type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 font-bold text-white hover:bg-blue-700">Save details</button>
    </form>

    <section class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-4">
      <h2 class="font-bold">Phone login</h2>
      <p id="phone-login-status" class="mt-1 text-sm text-slate-600">Loading phone status…</p>
      <form id="phone-update-form" class="mt-3 space-y-3">
        <label class="block text-sm font-semibold" for="profile-phone">Mobile number
          <input id="profile-phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="077 123 4567 or +94 77 123 4567" class="mt-2 w-full rounded-xl border border-slate-200 bg-white p-3 font-normal outline-none focus:border-blue-500">
        </label>
        <button id="send-phone-code" type="submit" class="w-full rounded-xl border border-blue-200 bg-white px-4 py-3 font-bold text-blue-700 hover:bg-blue-50">Verify phone for login</button>
      </form>
      <form id="phone-otp-form" class="mt-3 space-y-3" hidden>
        <label class="block text-sm font-semibold" for="phone-change-code">SMS verification code
          <input id="phone-change-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required class="mt-2 w-full rounded-xl border border-slate-200 bg-white p-3 font-normal outline-none focus:border-blue-500">
        </label>
        <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 font-bold text-white hover:bg-blue-700">Confirm phone number</button>
      </form>
    </section>

    <p id="account-message" role="status" aria-live="polite" class="mt-4 text-center text-sm text-red-600"></p>
    <nav class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2">
      <a href="cart.html" class="rounded-xl border border-blue-200 p-4 text-center font-bold text-blue-700 hover:bg-blue-50">My Cart</a>
      <a href="products.html?wishlist=1" class="rounded-xl border border-pink-200 p-4 text-center font-bold text-pink-700 hover:bg-pink-50">My Wishlist</a>
    </nav>
    <button id="signout-button" type="button" class="mt-5 w-full rounded-xl bg-slate-900 px-5 py-3 font-bold text-white hover:bg-slate-700">Sign Out</button>
    <a href="index.html" class="mt-5 block text-center text-sm text-slate-500 hover:text-blue-600">Continue shopping</a>
  </main>

  <script src="supabase-config.js"></script>
  <script src="customer-data.js"></script>
  <script>
    let accountUser = null;
    let pendingPhoneChange = '';
    const sb = getSupabase();
    const message = document.getElementById('account-message');

    function normalizeAccountPhone(value) {
      const raw = value.trim().replace(/[\s()-]/g, '');
      if (raw.startsWith('+')) return raw;
      if (raw.startsWith('00')) return '+' + raw.slice(2);
      if (raw.startsWith('94') && raw.length === 11) return '+' + raw;
      if (raw.startsWith('0')) return '+94' + raw.slice(1);
      return '+94' + raw;
    }

    async function saveProfile(phone = accountUser?.phone || null) {
      if (!accountUser) throw new Error('Please sign in again.');
      const { error } = await sb.from('customer_profiles').upsert({
        user_id: accountUser.id,
        full_name: document.getElementById('profile-name').value.trim(),
        address: document.getElementById('profile-address').value.trim(),
        phone
      }, { onConflict: 'user_id' });
      if (error) throw error;
    }

    (async () => {
      await window.GogoCustomerData.ready;
      accountUser = window.GogoCustomerData.getUser();
      if (!accountUser) { location.href = 'sign-in.html'; return; }
      document.getElementById('profile-email').value = accountUser.email || '';
      const { data: profile, error } = await sb.from('customer_profiles')
        .select('full_name,address,phone').eq('user_id', accountUser.id).maybeSingle();
      if (error) throw error;
      document.getElementById('profile-name').value = profile?.full_name || accountUser.user_metadata?.full_name || '';
      document.getElementById('profile-address').value = profile?.address || '';
      document.getElementById('profile-phone').value = accountUser.phone || profile?.phone || accountUser.user_metadata?.phone || '';
      document.getElementById('phone-login-status').textContent = accountUser.phone
        ? 'Phone number verified. You can sign in with this number and your password.'
        : 'This account was created with email. Verify a mobile number here to enable phone login.';
    })().catch(error => {
      console.error(error);
      message.textContent = error.message || 'Could not load your account details.';
    });

    document.getElementById('profile-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('save-profile-button');
      button.disabled = true;
      message.textContent = '';
      try {
        await saveProfile();
        message.className = 'mt-4 text-center text-sm text-emerald-700';
        message.textContent = 'Your details are saved to your private account profile.';
      } catch (error) {
        message.className = 'mt-4 text-center text-sm text-red-600';
        message.textContent = error.message || 'Could not save your details.';
      } finally { button.disabled = false; }
    });

    document.getElementById('phone-update-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('send-phone-code');
      button.disabled = true;
      message.className = 'mt-4 text-center text-sm text-red-600';
      message.textContent = '';
      pendingPhoneChange = normalizeAccountPhone(document.getElementById('profile-phone').value);
      if (!/^\+[1-9][0-9]{7,14}$/.test(pendingPhoneChange)) {
        message.textContent = 'Enter a valid mobile number with country code.';
        button.disabled = false;
        return;
      }
      try {
        const { error } = await sb.auth.updateUser({ phone: pendingPhoneChange });
        if (error) throw error;
        document.getElementById('phone-otp-form').hidden = false;
        message.className = 'mt-4 text-center text-sm text-emerald-700';
        message.textContent = `Verification code sent to ${pendingPhoneChange}.`;
      } catch (error) {
        message.textContent = error.message || 'Could not send a phone verification code.';
        button.disabled = false;
      }
    });

    document.getElementById('phone-otp-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const { data, error } = await sb.auth.verifyOtp({
          phone: pendingPhoneChange,
          token: document.getElementById('phone-change-code').value.trim(),
          type: 'phone_change'
        });
        if (error) throw error;
        accountUser = data.user;
        await saveProfile(accountUser.phone || pendingPhoneChange);
        document.getElementById('profile-phone').value = accountUser.phone || pendingPhoneChange;
        document.getElementById('phone-login-status').textContent = 'Phone number verified. You can sign in with this number and your password.';
        document.getElementById('phone-otp-form').hidden = true;
        message.className = 'mt-4 text-center text-sm text-emerald-700';
        message.textContent = 'Phone login is now enabled for this account.';
      } catch (error) {
        message.className = 'mt-4 text-center text-sm text-red-600';
        message.textContent = error.message || 'Phone verification failed. Check the code and try again.';
        button.disabled = false;
      }
    });

    document.getElementById('signout-button').addEventListener('click', async event => {
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = 'Signing out...';
      try { await window.GogoCustomerData.signOut(); }
      catch (error) { message.textContent = error.message || 'Could not sign out. Please retry.'; button.disabled = false; button.textContent = 'Sign Out'; }
    });
  </script>
</body>
</html>
